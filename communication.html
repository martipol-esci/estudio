 const ns=parts.reduce((n,p)=>n+p.s.length,0);if(!ns&&!parts.some(p=>p.ex.length||p.mc.length))throw new Error('Claude no ha encontrado contenido nuevo respecto al temario actual.');
 PEND=parts;msg('');$('#pend').innerHTML=pendHTML();bindPend();$('#pend').scrollIntoView({behavior:'smooth'})}
catch(e){msg(`<p class="ko">⚠️ ${e&&e.code==='not_granted'?'No se dio permiso para usar Claude.':e&&e.code==='rate_limited'?'Has hecho demasiadas peticiones: espera un poco y vuelve a intentarlo.':e&&e.code==='invalid_json'?'La respuesta de Claude salió incompleta. Prueba con un documento más corto (por ejemplo, un tema cada vez).':esc(e&&e.message||'Algo ha fallado. Inténtalo de nuevo.')}</p>`)}
finally{BUSY=false;const g=$('#go');if(g)g.disabled=false}}}
function pendHTML(){if(!PEND)return '';const p=PEND,u=p[0],c=k=>p.reduce((n,x)=>n+x[k].length,0),secs=p.flatMap(x=>x.s),exs=p.flatMap(x=>x.ex);
return `<div class="card" style="border-color:var(--ac)"><h3>Vista previa · ${u.target==='new'?`tema nuevo ${u.topic.n}: ${u.topic.t}`:`añadir a ${u.target}`}</h3><p>${secs.length} apartados · ${c('ex')} preguntas de examen · ${c('mc')} test</p>
${secs.map(s=>`<details style="margin:4px 0"><summary><b>${s.h}</b></summary>${(s.f||[]).map(f=>`<div class="fx">${f}</div>`).join('')}${s.k?`<ul class="k">${s.k.map(([a,b])=>`<li><b>${a}</b>: ${b}</li>`).join('')}</ul>`:''}</details>`).join('')}
${exs.length?`<details style="margin:4px 0"><summary><b>Preguntas de examen</b></summary><ul class="k">${exs.map(q=>`<li>${CRIT[q.c][0]} ${q.q}</li>`).join('')}</ul></details>`:''}
<div class="row"><button class="pri" id="psave">✅ Guardar en la app</button><button id="pdrop">Descartar</button></div><div id="pmsg"></div></div>`}
function bindPend(){const s=$('#psave');if(!s)return;
s.onclick=async()=>{s.disabled=true;$('#pmsg').innerHTML='<p class="mut">Guardando…</p>';try{await saveUp(PEND);const n=PEND[0];PEND=null;$('#pend').innerHTML=`<div class="card fb good">✅ Guardado. Ya lo tienes en <b>📘 Temario</b>${n.target==='new'?` (${n.topic.n})`:` (${n.target})`} y en <b>✍️ Exam practice</b>.</div>`;rerender()}
catch(e){s.disabled=false;$('#pmsg').innerHTML=`<p class="ko">No se pudo guardar${e&&e.code==='quota_exceeded'?': el almacenamiento está lleno':''}. Inténtalo de nuevo.</p>`}};
$('#pdrop').onclick=()=>{PEND=null;$('#pend').innerHTML=''}}
const tblH=r=>`<table><tr>${r[0].map(x=>`<th>${x}</th>`).join('')}</tr>${r.slice(1).map(x=>`<tr>${x.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
function learn(){const tp=T[topic];
$('#view').innerHTML=`<div class="chips">${T.map((x,i)=>`<button class="${i===topic?'on':''}" data-t="${i}">${x.n} · ${x.t}</button>`).join('')}</div>
<h2 class="topic-h">${tp.n} · ${tp.t}</h2><p class="mut topic-sub">${tp.d}</p>
<div class="card toc">${tp.s.map((s,i)=>`<a href="#s${i}">${i+1}. ${s.h}</a>`).join('')}</div>
${tp.s.map((s,i)=>`<section class="card" id="s${i}"><h3>${i+1}. ${s.nu?'🆕 ':''}${s.h}</h3>${(s.f||[]).map(f=>`<div class="fx">${f}</div>`).join('')}${s.k?`<ul class="k">${s.k.map(([a,b])=>`<li><b>${a}</b>: ${b}</li>`).join('')}</ul>`:''}${s.tbl?tblH(s.tbl):''}${s.ej?`<div class="ej">💡 <b>Ej:</b> ${s.ej}</div>`:''}${s.tr?`<div class="tr">⚠️ <b>Trampa:</b> ${s.tr}</div>`:''}</section>`).join('')}
<div class="row"><button class="pri" id="go">Practicar ${tp.n} →</button></div>`;
document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{topic=+b.dataset.t;LS.set('ct-topic',topic);learn();scrollTo(0,0)});
$('#go').onclick=()=>{tab='quiz';LS.set('ct-tab',tab);qz=null;CFG.t=String(topic);render();scrollTo(0,0)}}
function form(){$('#view').innerHTML=`<div class="card"><h3>Esquemas y secuencias clave</h3><table><tr><th>Concepto</th><th>Esquema</th></tr>${FRAMES.map(([a,b])=>`<tr><td>${a}</td><td style="font-weight:600">${b}</td></tr>`).join('')}</table></div>
<div class="card"><h3>Diferencias clave</h3><table><tr><th>Conceptos</th><th>Diferencia</th></tr>${DIFF.map(([a,b])=>`<tr><td><b>${a}</b></td><td>${b}</td></tr>`).join('')}</table></div>`}

/* ---------- exam practice (English UI) ---------- */
let CFG=LS.get('ct-cfg2',{t:'all',k:'mock',n:5});
function pct(k){const x=P[k];return x&&x.n?Math.round(100*x.ok/x.n):null}
const GUIDE=`<details class="card"><summary><b>📋 How the final exam works (from the assessment plan)</b></summary>
<p style="margin:8px 0 4px"><b>Final examination · 60 %</b> · individual comprehensive written exam. It is marked on four criteria, and each question type here trains one of them:</p>
<ul class="k">${Object.values(CRIT).map(([i,n,d])=>`<li>${i} <b>${n}</b>: ${d}</li>`).join('')}</ul>
<p style="margin:8px 0 2px"><b>Answer recipes</b></p><ul class="k">
<li><b>Analysis:</b> name the concept → quote the evidence from the case → explain the effect on the receiver → (priority / fix).</li>
<li><b>Application:</b> write the thing → then justify it with 2–3 course concepts.</li>
<li><b>Reasoned response:</b> position → 2–3 reasons with course concepts → an example → a qualification (“However… / unless…”).</li></ul>
<p class="mut" style="margin:6px 0 0">The rest of the grade: in-class activities 20 % · group presentation 20 %.</p></details>`;
function quiz(){if(qz)return showQ();const v=$('#view');
const opts=[['all','🎲 Whole syllabus']].concat(T.map((x,i)=>[String(i),x.n+' · '+x.t]));
const types=[['mock','🎯 Mock exam (one of each type)'],['all','All exam-style questions'],['K','📖 Knowledge'],['A','🔍 Analysis (cases)'],['P','🛠️ Application'],['R','🧠 Reasoned response'],['mc','⚡ Quick review (A–D)']];
v.innerHTML=GUIDE+`<div class="card"><h3>Choose what to practise</h3>
<div class="chips">${opts.map(([k,l])=>{const p=k==='all'?null:pct(k);return `<button data-c="${k}" class="${CFG.t===k?'on':''}">${l}${p!==null?` <span class="mut">· ${p}%</span>`:''}</button>`}).join('')}</div>
<p class="mut" style="margin:4px 0">Question type</p>
<div class="row">${types.map(([k,l])=>`<label class="r"><input type="radio" name="k" value="${k}" ${CFG.k===k?'checked':''}> ${l}</label>`).join('')}</div>
<div id="nrow"><p class="mut" style="margin:4px 0">Number of questions</p>
<div class="row">${[3,5,8,12].map(n=>`<label class="r"><input type="radio" name="n" value="${n}" ${CFG.n===n?'checked':''}> ${n}</label>`).join('')}</div></div>
<div class="row"><button class="pri" id="start">Start</button></div>
<p class="mut">You are marked like in the exam: on whether you use the right concepts, apply them to the case and justify your answer – not on perfect English. Questions you fail come back at the end of the round.</p></div>`;
const nr=()=>{$('#nrow').style.display=CFG.k==='mock'?'none':''};nr();
v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{CFG.t=b.dataset.c;LS.set('ct-cfg2',CFG);quiz()});
v.querySelectorAll('input[name=k]').forEach(r=>r.onchange=()=>{CFG.k=r.value;LS.set('ct-cfg2',CFG);nr()});
v.querySelectorAll('input[name=n]').forEach(r=>r.onchange=()=>{CFG.n=+r.value;LS.set('ct-cfg2',CFG)});
$('#start').onclick=()=>{const inT=t=>CFG.t==='all'||String(t)===CFG.t;
const ex=EX.filter(q=>inT(q.t)).map(q=>({type:'wr',...q}));
let pool;
if(CFG.k==='mc')pool=shuf(MC.filter(q=>inT(q[0])).map(q=>({type:'mc',t:q[0],q:q[1],o:q[2],a:q[3],e:q[4]}))).slice(0,CFG.n);
else if(CFG.k==='mock'){pool=[];['K','A','A','P','R'].forEach(c=>{const c1=shuf(ex.filter(q=>q.c===c&&!pool.includes(q)));if(c1[0])pool.push(c1[0])})}
else pool=shuf(ex.filter(q=>CFG.k==='all'||q.c===CFG.k)).slice(0,CFG.n);
if(!pool.length){alert('There are no questions of that type for this topic.');return}
qz={qs:pool,i:0,round:1,ok:[],wrong:[],first:[],total:pool.length,mock:CFG.k==='mock',scores:[]};showQ()}}

function finish(q,ok,score){rec(String(q.t),ok);if(qz.round===1&&score!=null)qz.scores.push({c:q.c,s:score});if(ok)qz.ok.push(q);else{qz.wrong.push(q);if(!qz.first.includes(q))qz.first.push(q)}}
function showQ(){const v=$('#view'),q=qz.qs[qz.i];if(!q)return endPass();
const cr=q.c?CRIT[q.c]:null;
const head=`<p class="mut">${qz.mock?'🎯 Mock exam · ':''}Round ${qz.round} · question ${qz.i+1}/${qz.qs.length} · <span class="tag">${T[q.t].n}</span> <span class="tag">${cr?cr[0]+' '+cr[1]:'⚡ Quick review'}</span></p><div class="bar"><i style="width:${100*qz.i/qz.qs.length}%"></i></div>`;
const next=`<button class="pri" id="nx">Next →</button>`;
if(q.type==='mc'){const ord=q.ord||(q.ord=shuf([0,1,2,3]));
v.innerHTML=head+`<div class="card"><h2>${q.q}</h2>${ord.map((oi,j)=>`<button class="opt" data-o="${oi}"><span class="l">${'ABCD'[j]}</span><span>${q.o[oi]}</span></button>`).join('')}<div id="fb"></div></div>`;
let done=false;v.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(done)return;done=true;const pick=+b.dataset.o,ok=pick===q.a;finish(q,ok,null);
v.querySelectorAll('.opt').forEach(x=>{const o=+x.dataset.o;if(o===q.a)x.classList.add('good');else if(o===pick)x.classList.add('bad');x.disabled=true});
$('#fb').innerHTML=`<div class="fb ${ok?'good':'bad'}"><b class="${ok?'ok':'ko'}">${ok?'✓ Correct':'✗ Incorrect'}</b> — ${q.e}${ok?'':'<div class="mut">You’ll repeat it at the end of the round.</div>'}</div><div class="row">${next}</div>`;$('#nx').onclick=()=>{qz.i++;showQ()};$('#nx').focus()});
return}
const checklist=`<p style="margin:8px 0 2px"><b>📝 A good answer includes</b></p><ul class="k">${q.k.map(x=>`<li>${x.split('|')[0]}</li>`).join('')}</ul>`;
v.innerHTML=head+`<div class="card"><p class="mut" style="margin:0 0 6px">${cr[0]} <b>${cr[1]}</b> — ${cr[2]}</p>${q.cs?`<div class="case">${q.cs}</div>`:''}<h2>${q.q}</h2><textarea id="ans" style="min-height:${q.c==='R'?220:q.c==='K'?120:170}px" placeholder="${q.c==='R'?'Position → reasons with course concepts → example → qualification':q.c==='A'?'Concept → evidence from the case → effect → fix':q.c==='P'?'Write it, then justify it with course concepts':'Explain in your own words, with a short example'}"></textarea><div class="row"><button class="pri" id="chk">Mark my answer</button><button id="hint">💡 Hint</button><button id="skip">Show model answer</button></div><div id="hn"></div><div id="fb"></div></div>`;
const ta=$('#ans');ta.value=q.draft||'';ta.oninput=()=>{q.draft=ta.value};ta.focus();
$('#hint').onclick=()=>{$('#hn').innerHTML=`<div class="ej">${checklist}</div>`;$('#hint').disabled=true};
const lock=()=>{$('#chk').disabled=true;$('#skip').disabled=true;$('#hint').disabled=true;ta.readOnly=true};
$('#skip').onclick=()=>{lock();finish(q,false,0);$('#hn').innerHTML='';$('#fb').innerHTML=`<div class="fb bad"><b>Model answer:</b> ${q.m}${checklist}<div class="mut">You’ll repeat it at the end of the round.</div></div><div class="row">${next}</div>`;$('#nx').onclick=()=>{qz.i++;showQ()}};
$('#chk').onclick=async()=>{const a=ta.value.trim();if(a.length<3){ta.focus();return}lock();
const fb=$('#fb');let res=null;
if(SAMPLE){fb.innerHTML='<div class="fb"><span class="mut">⏳ Claude is marking your answer like an examiner…</span></div>';
try{res=await SAMPLE.json(gradePrompt(q,a),{modelTier:'default',effort:'low'});if(!res||typeof res.score!=='number')res=null}catch(e){res=null;if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'))SAMPLE=null}}
const r=res?fromClaude(res):localGrade(q,a);finish(q,r.ok,r.score);$('#hn').innerHTML='';
fb.innerHTML=`<div class="fb ${r.cls}"><b class="${r.ok?'ok':'ko'}">${r.title}</b>${r.body}<p style="margin:8px 0 0"><b>Model answer:</b> ${q.m}</p>${r.ok?'':'<div class="mut">You’ll repeat it at the end of the round.</div>'}${res?'':'<div class="mut" style="margin-top:6px">Automatic marking by key concepts (Claude marking is not available here). It checks whether you mention the concepts, not whether you use them well.</div>'}</div><div class="row">${next}</div>`;
$('#nx').onclick=()=>{qz.i++;showQ()}}}

const CRIT_PROMPT={K:'KNOWLEDGE: accurate explanation/distinction of the concepts, ideally with an example.',A:'ANALYSIS: the student must diagnose the specific case with course concepts, point to concrete evidence in the material, and explain the likely effect. Generic statements not tied to the case score low.',P:'APPLICATION: the student must actually produce what is asked (rewrite, opening, thesis, transition…) AND justify it with course concepts. Judge the quality of what they produced, not only the explanation.',R:'REASONED WRITTEN RESPONSE: clear position, reasons using course concepts, at least one example or evidence, and a qualification/limit. A list of concepts without an argument scores low.'};
function gradePrompt(q,a){return `You are the examiner for the university course "Communication Techniques" (ESCI-UPF). Mark a student's answer to a final-exam question. The exam is assessed on knowledge, analysis, application and reasoned written response.
This question mainly assesses ${CRIT_PROMPT[q.c]}
Do NOT penalise imperfect English, spelling or a short answer if the reasoning is right. A concise answer that uses the right concepts correctly and applies them should pass (score ≥ 5). The student may answer in English or Spanish. Write feedback in English, briefly, kindly and concretely (say exactly what to add or fix).
${q.cs?`\nCase material:\n${q.cs.replace(/<br>/g,'\n').replace(/<[^>]+>/g,'')}\n`:''}
Question: ${q.q}
What a good answer includes (guidance, not a strict checklist): ${q.k.map(x=>x.split('|')[0]).join('; ')}
Model answer: ${q.m}

Student answer:
"""${a.slice(0,4000)}"""

Reply ONLY with JSON in this shape:
{"score": number from 0 to 10 (one decimal allowed), "verdict": "excellent" | "good" | "pass" | "insufficient", "good": ["things done well"], "errors": ["concepts used wrongly or claims not justified, one sentence each"], "missing": ["important points missing"], "tip": "one concrete tip to get a higher mark next time"}`}
const li=(t,a,c)=>a&&a.length?`<p style="margin:8px 0 2px"><b class="${c}">${t}</b></p><ul class="k">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
function fromClaude(r){const n=Math.max(0,Math.min(10,Math.round(r.score*10)/10)),ok=n>=5;
return{ok,score:n,cls:n>=7?'good':ok?'mid':'bad',title:`${ok?'✓':'✗'} ${n}/10 · ${esc(r.verdict||(ok?'pass':'insufficient'))}`,
body:li('✓ Done well',r.good,'ok')+li('✗ Mistakes',r.errors,'ko')+li('➕ Missing',r.missing,'')+(r.tip?`<p style="margin:8px 0 0">💡 <b>Tip:</b> ${esc(r.tip)}</p>`:'')}}
function localGrade(q,a){const s=' '+norm(a)+' ';const hit=[],miss=[];
q.k.forEach(k=>{const alts=k.split('|').slice(1).map(norm).filter(Boolean);(alts.some(x=>s.includes(' '+x)||s.includes(x))?hit:miss).push(k.split('|')[0])});
const p=hit.length/q.k.length,ok=p>=.5,score=Math.round(p*100)/10;
return{ok,score,cls:p>=.75?'good':ok?'mid':'bad',title:`${ok?'✓':'✗'} ≈${score}/10 · ${hit.length}/${q.k.length} key points`,body:li('✓ Points you cover',hit,'ok')+li('➕ Points missing',miss,'')}}
function endPass(){const v=$('#view'),bien=qz.ok,mal=qz.wrong;const strip=s=>s.replace(/<[^>]+>/g,'');const L=a=>a.map(q=>`<li>${strip(q.q)}</li>`).join('');
let sc='';if(qz.round===1&&qz.scores.length){const avg=qz.scores.reduce((n,x)=>n+x.s,0)/qz.scores.length;const by={};qz.scores.forEach(x=>{(by[x.c]=by[x.c]||[]).push(x.s)});
sc=`<div class="card"><h3>${qz.mock?'🎯 Mock exam result':'Your marks'}: ${avg.toFixed(1)}/10</h3><table><tr><th>Criterion</th><th>Average</th></tr>${Object.entries(by).map(([c,a])=>`<tr><td>${CRIT[c][0]} ${CRIT[c][1]}</td><td>${(a.reduce((n,x)=>n+x,0)/a.length).toFixed(1)}/10</td></tr>`).join('')}</table></div>`;qz.lastSc=sc}
else sc=qz.lastSc||'';
if(!mal.length){const f=qz.first;v.innerHTML=sc+`<div class="card"><h2>🎉 Round complete!</h2><p>${qz.total} questions · ${qz.total-f.length} passed first time${qz.round>1?` · finished in ${qz.round} rounds`:''}.</p>${f.length?`<p class="mut">Review the ones you found hard:</p><ul>${f.map(q=>`<li>${strip(q.q)}<br><span class="mut">→ ${q.type==='mc'?q.o[q.a]:q.m}</span></li>`).join('')}</ul>`:''}<div class="row"><button class="pri" id="again">Another round</button><button id="menu">Change topic</button></div></div>`;
$('#again').onclick=()=>{qz=null;quiz();$('#start').click()};$('#menu').onclick=()=>{qz=null;quiz()};return}
v.innerHTML=sc+`<div class="card"><h2>Round ${qz.round}: ${bien.length} passed · ${mal.length} to repeat</h2>${bien.length?`<p class="ok"><b>✓ Passed</b></p><ul>${L(bien)}</ul>`:''}<p class="ko"><b>✗ To repeat</b></p><ul>${L(mal)}</ul><div class="row"><button class="pri" id="rep">Repeat the failed ones</button><button id="menu">Exit</button></div></div>`;
$('#rep').onclick=()=>{mal.forEach(q=>{delete q.ord;q.draft=''});qz.qs=shuf(mal);qz.i=0;qz.wrong=[];qz.ok=[];qz.round++;showQ()};$('#menu').onclick=()=>{qz=null;quiz()}}
/* load uploaded syllabus: db inside claude.ai, localStorage elsewhere */
if(!window.claude){UPS=LS.get('ct-uploads',[]);DBST='local';applyUploads()}
render();
if(window.claude)(async()=>{try{DB=await claude.use('db')}catch(e){DB=null}
if(!DB){UPS=LS.get('ct-uploads',[]);DBST='local';applyUploads();rerender();return}
const tm=setTimeout(()=>{if(DBST==='loading'){DBST='slow';rerender()}},10000);
DB.collection('uploads').onSnapshot(s=>{if(!s.metadata.fromCache)clearTimeout(tm);DBST='ok';UPS=s.docs.map(d=>({id:d.id,...d.data()}));applyUploads();rerender()},
e=>{clearTimeout(tm);DBST='err';rerender()})})();
</script>
</body></html>
