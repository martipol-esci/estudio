<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%]+/g,' ').trim();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let P=LS.get('ct-prog',{});
function rec(t,ok){const x=P[t]=P[t]||{ok:0,n:0};x.n++;if(ok)x.ok++;LS.set('ct-prog',P)}

/* ================= TEMARIO (esquemático) =================
 s: {h: título, k: [[concepto, explicación]], tbl: tabla, f: [esquemas], ej: ejemplo, tr: trampa de examen} */
const T=[
{n:'T1',t:'Purposeful Interaction',d:'Qué es comunicar, el modelo, adaptar el mensaje y la professional letter',s:[
{h:'Qué es la comunicación',k:[['Communicare (latín)','compartir, transmitir, participar, hacer algo común'],['Comunicar ≠ producir palabras','el mensaje debe LLEGAR, ser INTERPRETADO y generar un EFECTO'],['¿Cuándo empieza?','tanto lo deliberado como lo no intencionado comunica']],tbl:[['Dimensión','Significado','Ejemplo'],['Act','la conducta comunica, incluso sin intención','llegar tarde, silencio, evitar la mirada'],['Process','el mensaje circula entre participantes por un canal','una estudiante envía un email a una empresa'],['Goal','el emisor quiere que algo se entienda o provoque respuesta','pedir información sobre prácticas'],['Skill','se puede practicar, evaluar y mejorar','revisar el tono de un email tras recibir feedback']],tr:'La conducta, el silencio y la omisión también comunican → dimensión <b>Act</b>.'},
{h:'Modelo del proceso comunicativo',f:['SENDER → MESSAGE → RECEIVER → EFFECT','condicionado por PURPOSE + CONTEXT + CHANNEL · el FEEDBACK modifica el siguiente mensaje'],tbl:[['Elemento','Pregunta clave'],['Sender','¿Quién comunica? ¿Qué posición/relación tiene?'],['Receiver','¿Quién debe recibirlo? ¿Lo verá realmente esa persona?'],['Purpose','¿Informar, pedir, convencer, crear una impresión…?'],['Message','¿Cuál es la idea central?'],['Channel','¿Email, llamada, videollamada, carta, red social…?'],['Context','¿Qué relación, momento y situación?'],['Noise','¿Qué puede dificultar recepción o interpretación?'],['Feedback','¿Qué respuesta me dice cómo se recibió?'],['Effect','¿Qué respuesta, decisión o impresión generará?']]},
{h:'Noise vs feedback',k:[['Noise','cualquier factor que obstaculiza, distorsiona o dificulta el significado'],['Ej. noise','fallo técnico, destinatario incorrecto, jerga desconocida, ansiedad, distracción, ambigüedad, diferencias culturales'],['Feedback','información de retorno que permite al emisor conocer la reacción del receptor'],['Ej. feedback','respuesta escrita, pregunta de seguimiento, expresión facial, silencio o demora, acción realizada']],tr:'Noise ≠ solo ruido físico (destinatario equivocado o canal inadecuado también son noise). Feedback ≠ effect: feedback = info de retorno; effect = resultado producido.'},
{h:'Verbal, non-verbal y contextual',k:[['Idea clave','el significado se produce por 3 vías; las palabras son solo una']],tbl:[['Tipo','Incluye','Ejemplo'],['Verbal','word choice, sentence structure, register, explicit claims','palabras precisas, petición clara'],['Non-verbal','voice, facial expression, gesture, posture, silence','tono, mirada, pausas'],['Contextual','relationship, place, time, channel, expectations, previous messages','la misma frase se entiende distinto en una entrevista que entre amigos']]},
{h:'Analizar una situación: las 8 preguntas',k:[['1. Who','¿quién comunica y quién debe recibirlo?'],['2. Purpose','¿qué intenta conseguir el emisor?'],['3. Message','¿cuál es el mensaje central?'],['4. Channel/form','¿qué canal y forma se usan?'],['5. Context','¿qué contexto condiciona la interpretación?'],['6. Noise','¿qué puede crear malentendidos?'],['7. Feedback','¿qué feedback hay disponible?'],['8. Effect','¿qué respuesta o efecto es probable?']],ej:'Estudiante de 1º envía una nota de voz a la cuenta general de redes de una multinacional pidiendo prácticas y exige respuesta al día siguiente (la cuenta la lleva una agencia). Purpose: info + buena impresión · Mismatch: canal y cuenta no llegan a la persona adecuada · Effect: sin respuesta o mala impresión.',tr:'El mensaje no tiene por qué ser falso ni maleducado: el problema es que la <b>situación comunicativa está mal diseñada</b>.'},
{h:'La comunicación se aprende',f:['NOTICE → CHOOSE → PRACTISE → RECEIVE FEEDBACK → REVISE'],k:[['Competencia comunicativa','crece al identificar qué pasa, elegir conscientemente, practicar, recibir feedback y revisar']]},
{h:'Adaptar el mensaje a la situación',f:['PURPOSE → AUDIENCE → CONTEXT → REGISTER → FORMAT'],tbl:[['Factor','Qué decides'],['Purpose','qué respuesta o resultado buscas'],['Audience','quién lo lee, qué sabe, qué necesita, qué relación tiene contigo'],['Context','situación, momento, normas, expectativas'],['Register','nivel de formalidad y estilo'],['Format','email, carta, llamada, presentación…']],tr:'Adaptar ≠ solo cambiar vocabulario: cambian propósito, relación, estructura y respuesta esperada. Empieza ANTES de redactar: “planificación, no decoración”.'},
{h:'Professional register',tbl:[['Too casual','Professional','Too ceremonial'],['demasiada familiaridad, abreviaturas vagas, expresiones descuidadas → riesgo evitable','claro, respetuoso, intencionado, específico, fácil de responder','parece copiado, formalidad vacía, puede esconder el propósito']],tr:'Professional ≠ maximally formal. El registro correcto se ajusta a relación + propósito + expectativas del destinatario.'},
{h:'Specificity y tailoring',k:[['Tailoring','elegir una conexión concreta y relevante para el destinatario'],['NO es','copiar la web de la empresa ni repetir elogios genéricos'],['Specificity','prueba de que se ha tenido en cuenta a la audiencia']],ej:'Generic: “I have always admired your prestigious company…” → Tailored: “Your work in urban food distribution interests me because a university project introduced me to last-mile logistics.”',tr:'El tailored funciona porque conecta una actividad REAL de la empresa con una experiencia CONCRETA del candidato.'},
{h:'5 preguntas antes de escribir',k:[['1','¿Qué respuesta quiero?'],['2','¿Quién es el destinatario y qué necesita saber?'],['3','¿Qué información es relevante para esta empresa y situación?'],['4','¿Qué registro y formato harán creíble el mensaje?'],['5','¿Cómo ordeno las ideas para que el propósito se vea enseguida?']]},
{h:'Email vs letter',k:[['Decisiones comunes','purpose, recipient, register, selección y orden de info, opening, closing, expected response'],['Subject line','orienta y anticipa el propósito'],['Email','entra antes en el asunto, párrafos más breves'],['Attachments/links','pertinentes y bien identificados'],['Follow-up','ni exigir respuesta desproporcionadamente rápida ni dejar ambiguo el siguiente paso']]},
{h:'Evaluar aperturas',f:['Criterios: REGISTER + CLARITY + COMPANY SPECIFICITY'],tbl:[['Apertura','Evaluación'],['“Hey! I saw your company online and thought it looked cool.”','Too casual · poca especificidad → Weak'],['“I hereby wish to communicate my profound desire…”','Too ceremonial · oculta el propósito → Weak'],['“I am interested in a summer internship with your customer-experience team.”','Clara y profesional, poco personalizada → Usable'],['“Your recent expansion into reusable packaging connects with my coursework on circular business models.”','Específica, demuestra preparación → Strongest']],tr:'Se acepta otro ranking siempre que los criterios se apliquen de forma coherente.'},
{h:'Credibilidad: se demuestra, no se proclama',f:['ASSET + EVIDENCE + RELEVANCE'],tbl:[['Parte','Qué es','Ejemplo'],['Asset','capacidad que importa para la situación','organisation'],['Evidence','ejemplo concreto de cuándo/cómo se usó','creé un calendario compartido y repartí tareas semanales'],['Relevance','conexión con la empresa o el puesto','me ayudaría en un equipo de proyectos']],ej:'“I work very well in teams” → “During a group project on market entry, I coordinated four classmates and consolidated our research into one presentation. That would help me contribute to a collaborative internship team.”',tr:'“I am hardworking, creative…” = afirmaciones sin prueba ni conexión con el puesto. La evidencia debe ser concreta, verificable y relacionada.'},
{h:'Estructura de una professional letter',f:['PURPOSE → COMPANY FIT → ASSETS AND EVIDENCE → CLOSE AND ACTION'],tbl:[['#','Parte','Función'],['1','Purpose','presentarte, identificar la oportunidad, por qué escribes'],['2','Company fit','razón genuina y específica por la que te interesa la empresa'],['3','Assets and evidence','qué aportas y por qué es creíble'],['4','Close and action','siguiente paso, facilitar la respuesta']],k:[['Por qué este orden','el lector entiende por qué la recibe → encaje → aportación → qué acción se le propone']]},
{h:'El closing crea un siguiente paso',ej:'Weak: “I hope you like my letter. Please respond as soon as possible.” → Stronger: “I would welcome the opportunity to discuss how I could contribute as an intern. Thank you for considering my application.”',tr:'Respetuoso ≠ pasivo. El cierre hace visible la acción solicitada sin presionar ni exigir.'}]},

{n:'T2',t:'From Writing to Speaking, Diagnose & Revise',d:'Voz y entrega oral · diagnosticar y revisar mensajes',s:[
{h:'La voz transmite significado',tbl:[['Elemento','Función','Uso adecuado'],['Pace','velocidad del habla','rápido para mantener atención, lento para ser inteligible'],['Pauses','silencios que organizan','separar ideas, dar espacio a lo importante'],['Stress','énfasis en palabras/ideas','que se detecte lo clave'],['Pitch and rhythm','variación de tono y ritmo','evitar sonar mecánico o monótono']]},
{h:'Intelligibility vs credibility',k:[['Intelligibility','¿pueden OÍR y COMPRENDER? → sonidos completos, frases manejables, volumen audible, finales claros, pace controlado'],['Credibility','¿transmite CONFIANZA y seriedad? → tono natural (no ceremonial), claims específicas, entrega calmada, conexión con el receptor']],tr:'Un mensaje puede ser audible pero poco creíble, o seguro pero difícil de entender. “Clarity is more than pronunciation.”'},
{h:'Conceptos de comunicación oral',tbl:[['Concepto','Significado','Ejemplo'],['Diction','pronunciación clara + elección apropiada de palabras','pronunciar cada sílaba de “particularly”'],['Enunciation','articular sonidos individuales','que se oiga la /t/ final de “worked”'],['Elocution','técnica global de hablar','apertura clara, tono estable, cierre intencionado'],['Projection','llevar la voz a los oyentes sin gritar','que te oigan al fondo de la sala'],['Pace and pauses','velocidad y silencios','pausa tras la idea principal'],['Intonation and stress','tono y énfasis para señalar significado','enfatizar “customer retention”']],tr:'Diction = pronunciación + palabras · Enunciation = sonidos concretos · Elocution = técnica global. Diction y enunciation se solapan (overlap).'},
{h:'Non-verbal choices',k:[['Cámara','mirar a cámara lo suficiente para dirigirte al oyente'],['Postura','estable, que no distraiga'],['Expresión facial','acorde con la situación profesional'],['Gestos','que no compitan con las palabras']],tr:'Lo no verbal debe APOYAR el mensaje, no ser el centro de atención.'},
{h:'Cómo ensayar una intervención oral',k:[['1','dilo una vez sin cronometrar'],['2','identifica la proposición central y la evidencia más sólida'],['3','elimina lo que no sirve al destinatario'],['4','ensaya en voz alta: ajusta pace, pauses, stress'],['5','graba una toma continua que suene natural']],tr:'El objetivo NO es una perfección artificial, sino mejores decisiones y una entrega natural y comprensible. (Referencia de clase: <i>Singin’ in the Rain</i>.)'},
{h:'Diagnosticar antes de reescribir',f:['SITUATION → PROBLEM → EFFECT → PRIORITY → REVISION'],k:[['Idea','no basta con decir “bad”: situación → problema concreto → efecto → qué corregir primero → revisión']]},
{h:'Empezar por la situación',k:[['1','¿Quién comunica y a quién?'],['2','¿Qué respuesta busca el emisor?'],['3','¿Qué canal, género y contexto condicionan el mensaje?'],['4','¿Qué necesita el receptor para responder?'],['5','¿Qué efecto producirá el mensaje actual?']]},
{h:'Seis problemas recurrentes',tbl:[['Área','Problema','Qué observar'],['Content & audience','1. Missing or irrelevant content','falta info o sobran detalles'],['Content & audience','2. Audience/recipient mismatch','no va a quien puede actuar'],['Clarity & tone','3. Ambiguity or imprecision','no se sabe qué se pide o afirma'],['Clarity & tone','4. Tone or register mismatch','demasiado informal, agresivo, ceremonial o distante'],['Structure & reasoning','5. Disordered structure','ideas sin orden'],['Structure & reasoning','6. Unsupported or inconsistent reasoning','afirmaciones sin razones ni coherencia']]},
{h:'Evidencias del problema según el modo',tbl:[['Message evidence','Delivery / form evidence'],['info ausente o irrelevante, detalles equivocados, wording ambiguo, tono inadecuado, secuencia débil','canal inadecuado, voz poco clara, non-verbal distractor, visual ilegible, formato, technical noise']]},
{h:'Justificar el diagnóstico con efectos',k:[['Clave','el EFECTO conecta la evidencia con el juicio']],tbl:[['Débil','Sólido'],['“The email is rude.” / “Not professional.”','“The message transfers responsibility to the recipient without identifying the missed content. The vague subject and disproportionate request make a useful answer less likely.”'],['“The subject line is bad.”','“The subject ‘Important’ does not identify the topic, so the recipient cannot assess purpose or urgency before opening it.”']]},
{h:'Caso: “send me everything”',ej:'Subject “Important”. El alumno faltó a varias clases y pide TODOS los materiales y que le expliquen todo cuanto antes.',k:[['Problema 1','propósito no delimitado: “everything” traslada una tarea enorme al profesor'],['Problema 2','subject line vago'],['Problema 3','no demuestra haber consultado antes los recursos'],['Efecto','menos probable una respuesta rápida y útil'],['Revisión','pregunta concreta sobre lo que sigue sin entender tras revisar AulaESCI → mejora task fulfilment, recipient adaptation y probabilidad de respuesta']]},
{h:'Cómo formular una buena revisión',f:['CHANGE (qué cambias) + WHY (qué problema resuelve y qué mejora)'],ej:'“I would replace [elemento] with [cambio concreto]. This improves [concepto] because [efecto esperado en el receptor].”',tr:'“Make it more professional” es demasiado general. Di QUÉ frase, contenido, canal u orden cambias y QUÉ efecto tendría.'}]},

{n:'T3',t:'Information, Opinion and Evidence',d:'Hechos vs juicios, evidencia, tesis · argumentación y retórica',s:[
{h:'Communicative intent',k:[['Pregunta central','What is the message asking us to accept?']],tbl:[['Intención','Objetivo','Ejemplo'],['Inform','hacer comprensible la información','a qué hora empieza un seminario'],['Persuade','influir en un juicio o acción','defender que un horario mejora la participación'],['Create','producir un efecto expresivo','pieza narrativa o artística']]},
{h:'Fact vs evaluative claim',tbl:[['Fact','Evaluative claim'],['se puede comprobar con evidencia','expresa un juicio; necesita razones y apoyo'],['“The seminar begins at 10:00.”','“Morning seminars produce better discussion.”']],tr:'Una evaluative claim no es necesariamente falsa: simplemente no se demuestra sola.'},
{h:'The support chain',f:['CLAIM → REASON → EVIDENCE → EXPLANATION → QUALIFICATION'],tbl:[['Elemento','Qué es','Pregunta'],['Claim','posición que defiendes','¿qué quiero que acepte?'],['Reason','por qué podría ser correcta','¿por qué aceptarla?'],['Evidence','dato, ejemplo o fuente que apoya la razón','¿qué prueba la respalda?'],['Explanation','cómo la evidencia apoya la claim','¿qué demuestra exactamente?'],['Qualification','límite o condición','¿cuándo es válida? ¿qué NO puedo afirmar?']],tr:'La evidencia no habla por sí sola: hay que explicar qué demuestra y sus límites.'},
{h:'5 criterios para evaluar evidencia',tbl:[['Criterio','Pregunta','Error típico'],['Relevance','¿apoya EXACTAMENTE la claim?','dato del tema que no prueba el argumento'],['Credibility','¿se puede comprobar fuente y método?','aceptar algo sin saber quién lo hizo ni cómo'],['Sufficiency','¿hay bastante? ¿un caso = patrón?','generalizar desde un caso o muestra pequeña'],['Interpretation','¿la conclusión va más allá de los datos?','correlación → causalidad'],['Context','¿qué info ausente cambiaría el sentido?','ignorar muestra, fecha, comparación']]},
{h:'Popularity is not proof of effectiveness',ej:'Vídeo universitario con 80.000 views → “el vídeo corto es el formato más eficaz para info académica compleja”. Sabemos: alcance alto. No sabemos: comprensión, si lo vio el público previsto, comparación con otros formatos. Conclusión defendible: llegó a mucha gente; faltan pruebas sobre lo bien que explicó.',tr:'Views miden ALCANCE/exposición, no comprensión, aprendizaje, persuasión ni efectividad.'},
{h:'Misinformation vs disinformation',tbl:[['Misinformation','Disinformation'],['falsa o inexacta, compartida SIN intención de engañar (puede dañar igual)','falsa o manipulada, creada/compartida DELIBERADAMENTE para engañar']],tr:'La diferencia es la INTENCIÓN, no el efecto: la misinformation también puede causar daño.'},
{h:'Scepticism vs relativism',tbl:[['Scepticism','Relativism'],['pregunta qué evidencia respalda la claim y qué sigue siendo incierto','trata todas las claims como igual de válidas']],tr:'Ser crítico ≠ decir que nada puede saberse. Scepticism examina pruebas; relativism equipara sin evaluar.'},
{h:'Five-question source check',tbl:[['Pregunta','Qué comprobar'],['Origin','quién lo produjo y con qué propósito'],['Date','¿suficientemente actual?'],['Method','cómo se obtuvo, midió o seleccionó'],['Context','qué se omitió o comparó'],['Corroboration','qué evidencia independiente lo confirma o complica']],k:[['8 pasos (infografía)','consider the source · read beyond · check the author · supporting sources · check the date · is it a joke? · check your biases · ask the experts']]},
{h:'The missing denominator',ej:'“El 80 % de 25 encuestados prefiere clases grabadas → todos los estudiantes quieren todo online.” Muestra pequeña (25), autoseleccionada, no representativa; no permite concluir “todos” ni “todo online”.',k:[['Conclusión mejor','“Most respondents in this optional online-study group preferred recorded lectures.”']],tr:'La conclusión debe tener el MISMO alcance que la evidencia.'},
{h:'Alternative explanations',k:[['Situación','la audiencia no responde ≠ lo ha rechazado'],['Alternativas','no lo vio · canal inadecuado · mal momento · acción poco clara · evento competidor'],['Pregunta clave','what evidence would distinguish each explanation?']],tr:'No elijas la primera explicación intuitiva: busca datos que discriminen entre hipótesis.'},
{h:'Qualified thesis',k:[['Tesis útil','responde a la pregunta exacta + adopta una posición + señala condición o límite']],ej:'Weak: “Social media is good and bad for communication.” → Qualified: “Social media can broaden access to public information when posts link to reliable sources, but short formats can oversimplify complex issues.”',tr:'No basta con decir que algo tiene ventajas y desventajas.'},

/* ================= EXAM-STYLE QUESTIONS =================
 Based on the assessment plan: final exam = individual comprehensive written exam,
 criteria: Knowledge · Analysis · Application · Reasoned written response.
 {t: topic, c: 'K'|'A'|'P'|'R', q: question, cs: case material (optional), k: ['what a good answer includes|synonyms…'], m: model answer} */
const CRIT={K:['📖','Knowledge','Explain or distinguish the concepts accurately, in your own words, with a short example.'],A:['🔍','Analysis','Diagnose the case using course concepts: point to concrete evidence in the material and explain its likely effect.'],P:['🛠️','Application','Produce something (a rewrite, opening, thesis, transition…) and justify why it works with course concepts.'],R:['🧠','Reasoned response','Take a clear position and defend it: claim → reasons → evidence/examples → qualification.']};
const EX=[
/* ---------- T1 ---------- */
{t:0,c:'K',q:'Explain the difference between noise, feedback and effect in the communication model. Give one example of each.',k:['Noise = anything that obstructs or distorts meaning (not only physical sound)|noise|obstacle|obstruct|distort|interfer','Feedback = return information about how the message was received|feedback|return|reaction|response|reply','Effect = the result produced (response, decision, impression)|effect|result|outcome|decision|impression','An example for each|example|e g|such as|for instance|wrong recipient|silence|delay'],m:'Noise is any factor that obstructs or distorts meaning – e.g. sending the email to the wrong recipient or using unknown jargon (not only physical sound). Feedback is return information that lets the sender know how the message was received – e.g. a follow-up question, a facial expression, or silence/delay. Effect is the result the message produces – e.g. the recruiter invites the student to an interview, or ignores the email. Feedback ≠ effect: feedback is information coming back; effect is what actually happens.'},
{t:0,c:'K',q:'Name the four dimensions of communication and explain why being late to an interview without saying anything can still communicate.',k:['Act|act','Process|process|channel','Goal|goal|purpose','Skill|skill|practis|improv','Behaviour, silence and omission communicate even without intention|behaviour|behavior|silence|without intention|unintention|omission'],m:'Communication is an act, a process, a goal and a skill. As an ACT, behaviour communicates even without intention: arriving late, staying silent or avoiding eye contact transmits meaning (e.g. lack of interest or poor planning). It is also a PROCESS (a message travels through a channel), it has a GOAL (making something understood or getting a response) and it is a SKILL that can be practised and improved.'},
{t:0,c:'A',cs:'Subject: hi<br><br>hey!! i saw ur company on insta and it looks super cool 😎 I’m hardworking, creative and a great team player. I want an internship in marketing. pls answer by tomorrow coz I need to know asap. thx<br>Leo',q:'Leo sends this email to the HR department of an international cosmetics company. Analyse the message: identify at least three problems using course concepts and explain the likely effect on the recipient.',k:['Register too casual (abbreviations, emojis, “hey”)|casual|informal|register|familiar|abbreviat','Unsupported claims: no asset + evidence + relevance|hardworking|unsupported|evidence|asset|claim|credib|proclaim','No tailoring / company specificity|generic|tailor|specific|cool|company fit','Vague subject line|subject','Disproportionate follow-up demand|tomorrow|asap|demand|pressure|follow up|urgent','Likely effect: no reply or poor first impression|effect|no reply|ignore|impression|unlikely'],m:'(1) Register: “hey!!”, “ur”, “pls”, emojis → too casual; it presumes familiarity and creates avoidable risk. (2) Credibility: “hardworking, creative, team player” are proclaimed, not demonstrated – no asset + evidence + relevance. (3) No tailoring: “looks super cool” shows no specific connection with the company. (4) The subject “hi” doesn’t orient the reader, and “answer by tomorrow” breaks follow-up conventions (disproportionate demand). Likely effect: the recruiter will probably not reply, or will form a negative first impression of an unplanned, unprofessional candidate.'},
{t:0,c:'A',cs:'A business student wants an internship at a large logistics company. She sends a LinkedIn message to the company’s CEO: “Hello, I am looking for any job in your company. I attach my CV. Could you tell me which positions are open? Thank you.”',q:'Use the “eight questions” to analyse this communicative situation. What is the main problem, and what would you change?',k:['Receiver mismatch: the CEO is not the person who can act|receiver|recipient|ceo|mismatch|right person|hr','Purpose is unclear / too broad (“any job”)|purpose|any job|vague|broad|unclear','Channel choice|channel|linkedin','Likely effect: no answer or forwarded/ignored|effect|no answer|ignore|unlikely','Proposed change: right recipient + specific purpose|change|instead|hr|recruit|specific position|tailor'],m:'Who/receiver: the CEO is unlikely to read it or to be the person who handles internships → recipient mismatch. Purpose: “any job” is too broad and transfers the work to the reader; there is no tailoring. Channel: a cold LinkedIn message with an attachment to a CEO is weakly suited. Feedback/effect: probably no reply. The main problem is that the situation is badly designed, not that the message is rude. Change: write to HR/the internship programme, name a specific position or team and give one tailored reason and one piece of evidence.'},
{t:0,c:'P',cs:'GreenCart is a Barcelona start-up that delivers groceries by electric cargo bike. Last month it opened in Valencia and announced it wants to reduce packaging waste by 50%.',q:'Write a strong opening sentence for an internship application to GreenCart. Then justify, using the three criteria for evaluating openings, why it is effective.',k:['A specific, tailored opening that mentions something real about GreenCart|valencia|packaging|electric|bike|cargo|waste|expansion','Register: professional, not casual or ceremonial|register|professional|formal|casual|ceremonial','Clarity: the purpose is immediately clear|clear|clarity|purpose','Company specificity: connects company + own experience|specific|tailor|connect|my project|course|experience'],m:'Example: “Your recent expansion to Valencia and your goal of halving packaging waste connect directly with my university project on last-mile sustainable logistics, and I would like to apply for your operations internship.” It works because: REGISTER – professional but natural (neither “hey” nor “I hereby wish…”); CLARITY – the purpose (internship) is stated at once; COMPANY SPECIFICITY – it links two real company facts to the candidate’s own experience, showing preparation rather than generic praise.'},
{t:0,c:'P',q:'Transform the claim “I am very organised” into a credible claim for a project-management internship. Label the three parts of the formula you are using.',k:['Asset: organisation|asset|organis|organiz','Evidence: concrete, verifiable example|evidence|example|project|calendar|deadline|coordinat|task','Relevance: link to the internship/role|relevance|internship|role|team|contribute|position'],m:'ASSET: organisation. EVIDENCE: “In a group project on market entry, I created a shared calendar, divided the research into weekly tasks and we delivered on time without duplicated work.” RELEVANCE: “This would help me keep project timelines on track in your project-management team.” Credibility is demonstrated, not proclaimed.'},
{t:0,c:'P',cs:'Closing of a letter: “I hope you like my letter. Please respond as soon as possible. Bye.”',q:'Rewrite this closing so that it creates a clear next step, and explain what you changed and why.',k:['Rewritten closing proposing a next step (e.g. interview/discussion)|discuss|interview|opportunity|welcome|meet|call','Thanks / respectful tone|thank|consider','Explains: respectful but not passive, no pressure|pressure|demand|passive|respectful|asap','Makes the response easy|easy|next step|action|respond'],m:'“I would welcome the opportunity to discuss how I could contribute to your team as an intern. Thank you for considering my application.” Changes: I removed the demand (“as soon as possible”), which pressures the reader, and the insecure “I hope you like my letter”. The new close states the action requested (a conversation/interview), thanks the reader and makes it easy to respond – respectful but not passive.'},
{t:0,c:'R',q:'“Being professional means being as formal as possible.” To what extent do you agree? Defend your position using course concepts and examples.',k:['Clear position (disagree / partly agree)|disagree|agree|partly|to some extent|position','Register must fit relationship, purpose and expectations|relationship|purpose|expectation|fit|audience|context','Too ceremonial can hide the purpose / sound copied|ceremonial|empty|inflated|hide|copied','Too casual creates avoidable risk|casual|familiar|risk','Example(s)|example|for instance|e g|opening|email','Qualification / limit|however|although|depends|unless|qualif|but'],m:'I largely disagree. Professional register means clear, respectful, purposeful, specific and easy to answer – adapted to the relationship, purpose and the recipient’s expectations (Purpose → Audience → Context → Register → Format). Maximum formality often becomes “too ceremonial”: e.g. “I hereby wish to communicate my profound desire…” sounds copied and hides the purpose. Being too casual (“hey, ur company looks cool”) is also risky. So the best register is the one that fits. Qualification: in some contexts (a formal complaint, a first contact with a senior institution) a higher degree of formality is appropriate – but even then clarity and specificity matter more than ornament.'},
/* ---------- T2 ---------- */
{t:1,c:'K',q:'Explain the difference between intelligibility and credibility in oral communication, and give one feature of each.',k:['Intelligibility = can the audience hear and understand|intelligib|hear|understand|audible','Feature of intelligibility (pace, volume, clear endings, sentence length)|pace|volume|ending|sentence|sound','Credibility = conveys trust and seriousness|credib|trust|confiden|serious','Feature of credibility (natural tone, specific claims, calm delivery)|natural|specific|calm|ceremonial|exaggerat','They can be independent (audible but not credible)|can be|but not|both|independent|more than pronunciation'],m:'Intelligibility = whether the audience can hear and understand the message: complete sounds, manageable sentence length, audible volume, clear endings, controlled pace. Credibility = whether the way it is said conveys trust and seriousness: a natural (not ceremonial) tone, specific rather than exaggerated claims, calm purposeful delivery. A speaker can be audible but not credible, or confident but hard to understand – clarity is more than pronunciation.'},
{t:1,c:'K',q:'Distinguish diction, enunciation, elocution and projection with one example each.',k:['Diction: clear pronunciation + word choice|diction','Enunciation: articulating individual sounds|enunciation|articulat|sound','Elocution: overall speaking technique|elocution|overall|global|technique','Projection: reaching listeners without shouting|projection|without shouting|back of the room|reach'],m:'Diction: clear, correct pronunciation and appropriate word choice (pronouncing every syllable of “particularly”). Enunciation: articulating individual sounds distinctly (the final /t/ of “worked”). Elocution: the overall manner and technique of speaking (clear opening, stable tone, purposeful close). Projection: carrying the voice to listeners without shouting (being heard at the back of the room). Diction and enunciation overlap.'},
{t:1,c:'A',cs:'Subject: project<br><br>Guys, nobody is doing anything. I already did my part. Send your slides whenever you can. The presentation is soon.<br>Marc',q:'Marc sends this message to his four group members. Diagnose it using the sequence Situation → Problem → Effect → Priority → Revision. Identify which of the six recurrent problems appear.',k:['Situation: who/what response is sought (group must deliver slides)|situation|group|response|seek','Ambiguity / imprecision (“whenever”, “soon”: no deadline)|ambigu|imprecis|whenever|soon|deadline|date','Tone mismatch (accusatory: “nobody is doing anything”)|tone|accus|aggress|blame|register','Missing content (what each person must do, format)|missing|content|task|who does what','Effect: defensiveness / slides arrive late|effect|defensiv|conflict|late|unlikely','Priority + specific revision|priority|first|revision|replace|instead'],m:'Situation: Marc needs his teammates to send their slides in time. Problems: (3) ambiguity – “whenever”, “soon” give no date; (4) tone mismatch – “nobody is doing anything” blames the readers; (1) missing content – no tasks, format or deadline; vague subject line. Effect: teammates may feel attacked and still not know when to deliver → slides arrive late. Priority: fix the ambiguity first, because without a deadline the task can’t be fulfilled. Revision: “Subject: Slides for Friday’s presentation – due Wednesday 18:00. Could each of you upload your two slides to the shared folder by Wednesday at 18:00? I’ve finished the introduction, so we can rehearse on Thursday.” This improves clarity and recipient adaptation.'},
{t:1,c:'A',cs:'During a 3-minute oral presentation, Ana reads from her phone, speaks very fast without pausing, swallows the ends of words, keeps the same flat tone and rarely looks at the audience. Her content is well researched.',q:'Analyse Ana’s delivery using concepts from the course. Which problems are message evidence and which are delivery/form evidence? What would you prioritise?',k:['Pace too fast / no pauses|pace|fast|pause','Enunciation / unclear endings → intelligibility|enunciat|ending|intelligib|swallow','Monotone: pitch, rhythm, stress|monoton|flat|pitch|rhythm|stress|intonation','Non-verbal: eye contact / reading|eye|look|reading|non verbal|presence|phone','It is delivery/form evidence, not message evidence|delivery|form|not the message|content is fine','Priority + justified fix|priority|first|rehears|slow|pause after'],m:'The message itself (content) is fine; the problems are delivery/form evidence. Pace: too fast and no pauses, so ideas are not separated. Enunciation: swallowed endings reduce intelligibility. Pitch, rhythm and stress: a flat tone makes it sound mechanical and hides the key points. Non-verbal: reading the phone and lack of eye contact weaken presence and credibility. Priority: pace and pauses first, because if the audience cannot follow, nothing else lands. Revision: rehearse aloud with the central proposition and strongest evidence, pause after each main idea, stress key words, and use brief notes instead of reading.'},
{t:1,c:'P',cs:'Subject: Question<br><br>Dear Sir, I hereby wish to enquire about the thing of the exam because I am not sure about it. Answer me.<br>Regards',q:'Propose TWO revisions to this email to a lecturer. For each one use the structure “I would replace … with … This improves … because …”.',k:['Revision of the vague subject line|subject','Revision of the ambiguity (“the thing of the exam”) → specific question|ambigu|specific|thing|which|date|topic|question','Revision of tone/register (“I hereby”, “Answer me”)|tone|register|ceremonial|answer me|demand|polite','Each change is justified with the effect on the recipient|because|improve|recipient|reply|respond|effect'],m:'1) “I would replace the subject ‘Question’ with ‘Question about the date of the final exam – Communication Techniques’. This improves clarity because the lecturer can identify the topic and urgency before opening it.” 2) “I would replace ‘the thing of the exam… Answer me’ with ‘Could you confirm whether the final exam includes Topic 4? I checked the course guide but couldn’t find it.’ This improves precision and register because it asks a bounded question, shows I checked the resources first and removes the demanding tone, so a quick useful reply is more likely.”'},
{t:1,c:'R',q:'“If a message is well written, it will communicate effectively.” Discuss, using concepts from Topics 1 and 2.',k:['Clear position (disagree / partly)|disagree|agree|partly|position|not necessarily','Channel / recipient / context can still fail|channel|recipient|context|situation|kairos|timing','Oral delivery matters (pace, pauses, intelligibility)|delivery|pace|pause|intelligib|voice|non verbal','Effect on the receiver is what counts|effect|receiver|interpret|response','Example|example|for instance|e g|voice note|case','Qualification|however|although|but|depends|qualif'],m:'I disagree. Communication works only when the message reaches the right receiver, is interpreted and produces an effect. A well-written text can still fail because of the situation: wrong recipient or channel (the student’s voice note to a general social-media account), bad timing, or noise. And when the message is spoken, delivery matters: pace, pauses, stress and enunciation determine intelligibility, and tone and non-verbal behaviour affect credibility. Qualification: good writing is a necessary foundation – a clear structure and specific content make effective delivery much easier – but it is not sufficient on its own.'},
/* ---------- T3 ---------- */
{t:2,c:'K',q:'Explain the difference between misinformation and disinformation, and between scepticism and relativism.',k:['Misinformation: false, shared without intent to deceive|misinformation|without intent|unintention|not deliberate','Disinformation: deliberately created/shared to mislead|disinformation|deliberat|intent|on purpose|mislead','The key difference is intention, not harm|intention|intent|both can|harm','Scepticism: asks what evidence supports a claim, accepts uncertainty|scepticism|skepticism|evidence|uncertain','Relativism: treats all claims as equally valid|relativism|equally valid|all claims|same'],m:'Misinformation is false or inaccurate information shared without intention to deceive; disinformation is false or manipulated information created or shared deliberately to mislead. The difference is intention – misinformation can be just as harmful. Scepticism asks what evidence supports a claim and what remains uncertain; relativism treats all claims as equally valid. Being critical means examining evidence, not saying nothing can be known.'},
{t:2,c:'K',q:'Describe the five elements of the support chain and explain why “evidence does not speak for itself”.',k:['Claim|claim','Reason|reason','Evidence|evidence','Explanation|explanation|explain','Qualification|qualification|limit|condition'],m:'Claim (the position) → Reason (why it could be right) → Evidence (data, example or source supporting the reason) → Explanation (how exactly the evidence supports the claim) → Qualification (the limit or condition that makes the conclusion precise). Evidence does not speak for itself: the same figure can be over-interpreted (e.g. correlation read as causation), so the writer must explain what it shows and what it does not.'},
{t:2,c:'A',cs:'Instagram post by a start-up: “StudyBuddy is the best study app in Spain! 🚀 It was downloaded 50,000 times in its first week, and 9 out of 10 users we surveyed in our Instagram stories love it.”',q:'Evaluate the evidence for the claim using the five criteria for evaluating evidence. Then write a conclusion that the evidence can actually support.',k:['Relevance: downloads measure reach, not quality / “best”|relevan|downloads|reach|exposure|best','Credibility: the company surveyed itself; method unclear|credib|source|method|self|own','Sufficiency / sample: small, self-selected Instagram followers|sufficien|sample|self selected|followers|small|representative','Interpretation: popularity ≠ effectiveness|interpret|popular|effective|causal|beyond','Context: denominator, comparison with other apps|context|denominator|compar|how many|other apps','Defensible, qualified conclusion|conclusion|defensible|reached|many|among|followers'],m:'Relevance: 50,000 downloads measure reach/exposure, not whether it is the “best” app or helps students learn. Credibility: the company produced the data itself; we don’t know the method. Sufficiency: “9 out of 10” – of how many? A self-selected sample of the company’s own followers is not representative (missing denominator). Interpretation: popularity is not proof of effectiveness. Context: no comparison with other apps or over time. Defensible conclusion: “StudyBuddy reached a large audience in its first week, and most followers who answered the company’s Instagram poll said they liked it; more independent evidence is needed to judge whether it is the best study app.”'},
{t:2,c:'A',cs:'Headline shared widely on WhatsApp: “Study PROVES remote work makes employees lazier.” The article is on an anonymous blog. It describes one software company in 2019 where 30 employees worked from home for a month and their number of emails sent fell by 20%.',q:'Apply the five-question source check to this item. Is the claim justified? Explain.',k:['Origin: anonymous blog, unknown purpose|origin|anonymous|author|blog|who','Date: 2019, may be outdated|date|2019|outdated|current','Method: 30 employees, one company, emails as a measure|method|30|one company|emails|measure|sample','Context: what is omitted, comparison|context|omit|compar|control','Corroboration: other independent sources?|corroborat|independent|other sources|cross check','Conclusion: “proves” overstates; correlation ≠ causation|prove|overstat|not justified|causation|correlation|qualif'],m:'Origin: anonymous blog – we don’t know who wrote it or why. Date: 2019, pre-pandemic, maybe outdated. Method: one company, 30 people, one month, and “emails sent” is a weak measure of laziness (they could be using calls or chat). Context: no comparison group; other changes may explain the fall. Corroboration: we would need independent studies. So the claim is not justified: “proves” overstates the evidence and turns a small correlation into causation. Defensible version: “In one small 2019 case, employees working remotely sent fewer emails; this does not show they worked less.”'},
{t:2,c:'A',cs:'At the company Christmas party, the CEO of a retail chain takes the microphone: “As your leader for 20 years, I know this is hard. Sales fell 18% this year and our costs rose 12%, so we will close 15 stores in January. Think of your families: if we do nothing, everyone could lose their job.”',q:'Identify ethos, logos and pathos in this speech and evaluate its kairos. Is there any risk of manipulation?',k:['Ethos: “your leader for 20 years” (credibility)|ethos|20 years|leader|credib','Logos: sales −18%, costs +12% (reasons/evidence)|logos|18|12|sales|costs|reason|evidence','Pathos: “think of your families” (values/fear)|pathos|famil|emotion|fear|value','Kairos: Christmas party is the wrong moment|kairos|moment|timing|christmas|party|context','Manipulation risk: fear without proportion / “everyone could lose their job”|manipulat|fear|proportion|everyone|exaggerat|pressure'],m:'Ethos: “as your leader for 20 years” builds credibility. Logos: sales −18% and costs +12% give reasons for the closures (though no explanation of why closing 15 stores is the solution). Pathos: “think of your families” appeals to values and fear. Kairos: very poor – announcing closures at a Christmas party is the wrong moment and context, so even accurate content will be received badly. Manipulation risk: “everyone could lose their job” may exploit fear without proportion and removes meaningful choice; ethical persuasion would present the evidence, alternatives considered and next steps for affected staff, in an appropriate setting.'},
{t:2,c:'A',cs:'A group preparing a debate has collected 40 statistics on electric cars but cannot say what they are defending. When they finally write their points, they present them in a random order. In rehearsal, one member reads every sentence from paper, and another speaks so quietly that nobody hears her.',q:'Diagnose which stages of the rhetorical canon are failing and propose one improvement for each.',k:['Inventio: no claim selected from the data|inventio|claim|position|select','Dispositio: random order|dispositio|order|arrange|structure','Memoria: reading every sentence|memoria|memor|reading|script','Actio: speaks too quietly (projection/voice)|actio|delivery|voice|quiet|projection','Concrete improvement for each|improve|should|choose|order|rehears|outline'],m:'Inventio fails: lots of data but no claim – they must choose a position and the 2–3 reasons the data best support. Dispositio fails: random order – arrange opening, a limited number of connected reasons, conclusion. Memoria fails: the speaker reads every sentence – internalise the structure using key-word notes. Actio fails: the second speaker is inaudible – work on projection and pace in rehearsal. (Elocutio could also be checked: is the vocabulary clear for the audience?)'},
{t:2,c:'P',q:'Write a qualified thesis answering: “Should companies use TikTok to recruit recent graduates?” Then explain which parts of your sentence make it qualified.',k:['A thesis that takes a clear position|should|can|position|yes|no','Includes a condition or limit|when|if|but|only|unless|as long as|condition|limit','Answers the exact question (TikTok / recruitment of graduates)|tiktok|recruit|graduate','Explanation of the components (position + condition/limit)|position|condition|limit|qualif|explain'],m:'“Companies should use TikTok to attract recent graduates when short videos direct candidates to detailed, reliable job information, but they should not rely on it for selection, because short formats oversimplify roles and exclude candidates who are not on the platform.” It answers the exact question, takes a position (“should use… to attract”) and adds a condition (“when videos direct to detailed information”) and a limit (“not for selection”, with a reason) – unlike a weak thesis such as “TikTok has advantages and disadvantages”.'},
{t:2,c:'P',cs:'Data you have: In a survey of 400 first-year students at your university (response rate 80%), 62% said they missed deadlines because course information was spread across three different platforms.',q:'Build a full support chain (claim, reason, evidence, explanation, qualification) arguing that the university should centralise course information.',k:['Claim|claim|should centrali|single platform','Reason|reason|because|confus|spread','Evidence (uses the survey data correctly)|62|400|survey|80','Explanation of what the data shows|explain|shows|suggest|link|this means','Qualification (first-years only; self-reported; correlation)|qualif|only|first year|self reported|may|limit|not all'],m:'CLAIM: the university should centralise course information on a single platform. REASON: information spread across platforms makes it harder for students to meet deadlines. EVIDENCE: in a survey of 400 first-year students (80% response rate), 62% said they missed deadlines because information was on three platforms. EXPLANATION: this suggests the fragmentation itself – not only student effort – is a barrier, so one platform would remove a cause of missed deadlines. QUALIFICATION: the data cover first-year students and are self-reported, so the effect may be smaller for other years and other causes may also contribute.'},
{t:2,c:'R',q:'“Persuasion is just a polite word for manipulation.” Discuss, using concepts from the course.',k:['Clear position (disagree)|disagree|not|position|agree','Rhetoric = organised communicative choice, makes judgement visible|rhetoric|organised|visible|judgement','Ethical persuasion: visible claim, relevant support, scrutiny, fair alternatives, respects agency|visible|scrutiny|alternatives|agency|autonomy|relevant support','Manipulation: hides purpose, distorts evidence, exploits fear/vulnerability, removes choice|hide|distort|fear|vulnerab|remove|choice|covert','Example|example|e g|for instance|ceo|advert|campaign','Qualification|however|although|can become|line|but'],m:'I disagree. Rhetoric is organised communicative choice – selecting reasons and adapting them to an audience and moment – and ethical persuasion makes judgement visible: it states the claim, uses relevant support (logos), allows scrutiny, represents alternatives fairly and respects the audience’s agency. Manipulation does the opposite: it hides the real purpose, distorts evidence, exploits fear without proportion, targets vulnerabilities covertly and removes meaningful choice. Example: a campaign explaining with sourced data why a policy reduces costs persuades; one inventing a threat to scare people manipulates. Qualification: the same appeals (e.g. pathos) can slide into manipulation when they replace evidence instead of supporting it, so the line depends on transparency and proportion.'},
{t:2,c:'R',q:'“The more people share a news story, the more reliable it is.” Do you agree? Use the course concepts on evidence and sources.',k:['Clear position (disagree)|disagree|not|position','Popularity / reach ≠ accuracy or effectiveness|popular|reach|views|share|not proof|exposure','Source check: origin, date, method, context, corroboration|origin|date|method|context|corroborat|source check','Misinformation spreads without intent|misinformation|disinformation|intent','Scepticism over relativism|scepticism|skepticism|evidence|relativ','Qualification|however|although|can|but|independent'],m:'I disagree. Sharing measures reach/exposure, not accuracy – popularity is not proof (just as 80,000 views don’t prove a video explains well). False stories often spread fast as misinformation (shared in good faith) or disinformation (spread deliberately). Reliability depends on the source check: origin, date, method, context and corroboration by independent sources – plus checking the author, reading beyond the headline and checking our own biases. A sceptical reader asks what evidence supports the claim rather than how many people believe it. Qualification: if many INDEPENDENT credible outlets confirm a story, that corroboration increases reliability – but that is about independent sources, not the number of shares.'},
/* ---------- T4 ---------- */
{t:3,c:'K',q:'Explain the difference between a topic-led and a proposition-led presentation and give an example of each.',k:['Topic-led: names an area, no direction|topic|area|no direction','Proposition-led: complete sentence stating what the audience should understand/accept|proposition|complete sentence|position|accept|understand','Example of a topic|example|e g|tariffs|suez|topic','Example of a proposition (full sentence with a position)|will|should|because|is likely'],m:'A topic-led presentation only names an area (e.g. “US tariffs on European cars”): the audience hears an area but not a direction. A proposition-led presentation states, in a complete sentence, what the group wants the audience to understand or accept (e.g. “New US tariffs will hurt German carmakers more than Spanish suppliers because of their export dependence”), so the audience knows where the argument goes and why.'},
{t:3,c:'K',q:'Explain “show vs say”: what belongs on a slide and what the speaker should say? Why should slides not carry the speech?',k:['Show: visual/data, short claim or label|show|visual|data|label|short claim','Show: brief source attribution / visible relationship|attribution|source|relationship','Say: interpretation, context, qualification|say|interpret|context|qualif','Say: transitions / details that would overload|transition|detail|overload','Slides support; the argument is carried by the speaker|support|speaker|carry|read'],m:'SHOW on the slide: the visual or data needed, a short claim or label, a brief source attribution and a visible relationship. SAY: the interpretation, the context and qualification, the transitions and details that would overload the visual. Slides support the speech but don’t carry it: if paragraphs are on screen, the audience reads instead of listening and the speaker just reads aloud.'},
{t:3,c:'A',cs:'Slide 4 of a group presentation: title “Tariffs”. Below it, a 180-word paragraph in 12-pt font, three different charts with no labels, a screenshot of a Google search results page as the “source”, and an animated logo in the corner.',q:'Evaluate this slide using course concepts and describe how you would redesign it.',k:['Topic title, not a claim|title|claim|label|topic','Overloaded: paragraph to read, competing ideas|paragraph|read aloud|overload|competing|too much|one job','Readability / hierarchy|readable|font|hierarchy|small','Search result is not a source; needs attribution / APA 7|google|search result|not a source|attribution|apa','Decoration without purpose|decorat|animat|logo|polish','Redesign: one job, short claim, one labelled chart, Author (year)|redesign|one chart|one job|short claim|author|year'],m:'The title “Tariffs” is a topic, not a claim. The slide is overloaded: a paragraph to read aloud, three competing charts and no hierarchy; 12-pt text is unreadable. A Google search page is not a source. The animated logo is visual polish without purpose. Redesign: one communicative job – a short claim as title (“Tariffs raise EU car export costs by 15%”), ONE labelled chart showing that relationship, a brief attribution (Author, year) and the full reference in APA 7 at the end; the speaker says the interpretation and context.'},
{t:3,c:'A',cs:'Opening of a group presentation: “Hello everyone, good morning. Today we are going to talk about the Red Sea shipping crisis. The Red Sea is a sea between Africa and Asia. Ships go through it. Then Pau will talk about the effects and Laia will do the conclusion.”',q:'Evaluate this opening and rewrite it so that it is purposeful.',k:['Generic: announces the topic, explains the obvious|generic|announce|obvious|today we','No relevance / no question / no route|relevance|question|route|why it matters','Handover names people, not the argument|handover|names people|pau|intellectual move','Rewritten opening: relevance + question + proposition/route|rewrite|imagine|question|which|will|proposition'],m:'It is a generic opening: it greets, announces the topic and explains the obvious, but gives no relevance, no question and no direction (topic-led). The preview names people rather than the argument. Rewrite: “Since December, ships avoiding the Red Sea add about ten days to Asia–Europe routes. That raises one question for international business: which consequence matters most? We will look at freight costs, delays for European manufacturers and pressure on insurers – and argue that delays to manufacturing will have the largest impact.” It creates relevance, establishes the question and previews the route.'},
{t:3,c:'P',cs:'Speaker 2 finishes explaining how freight prices rose. The current handover is: “OK, that’s all from me. Now Marta will talk.”',q:'Rewrite the handover so that it makes the group sound coherent. Name the type(s) of transition you used and explain why it is better.',k:['Rewritten handover naming the next step of the argument|rewrite|so|next|now that|which leads|marta will show|question','Backward link (connects to the point just made)|backward|just|we have seen|freight','Forward link (why next section matters now)|forward|why|next question|matters','Explains: names the intellectual move, not just the person|intellectual move|not just|person|coherence|argument'],m:'“So higher freight costs are only the first effect. The bigger question is what happens when the parts simply arrive late – and that’s what Marta will show with the case of European car manufacturers.” It uses a backward link (connects to freight costs, just established) and a forward link (explains why the next section matters now). It names the intellectual move, not just the next person, so the audience hears one argument instead of separate pieces.'},
{t:3,c:'P',cs:'Evidence you have: “Container shipping rates from Shanghai to Rotterdam rose by about 150% between November and January (Drewry, 2024).” Your proposition: delays will matter more than costs for European manufacturers.',q:'Write what you would say in the presentation to use this evidence, following Present → Interpret → Connect.',k:['Present: name the source and give only the needed figure|drewry|2024|150|present|source','Interpret: explain what the figure means / its limitation|interpret|means|limitation|temporary|however|only','Connect: link it to the proposition (delays > costs)|connect|proposition|delay|manufactur|argument|therefore'],m:'PRESENT: “According to Drewry (2024), container rates from Shanghai to Rotterdam rose by about 150% between November and January.” INTERPRET: “That is a sharp increase, but freight is a small share of the final price of most manufactured goods, and rates can fall again quickly.” CONNECT: “So the cost increase is real but manageable – which is why we argue that the delays, which stop production lines, will matter more for European manufacturers.”'},
{t:3,c:'P',cs:'After your presentation, someone in the audience asks: “Isn’t all your evidence just from one country? How can you generalise to all of Europe?”',q:'Write your answer to this question and explain which principles of handling questions you applied.',k:['Answers the actual question (the generalisation issue)|actual question|generalis|one country|yes|fair','Concise answer|concise|brief|short','Acknowledges uncertainty / limitation|acknowledge|uncertain|limitation|fair point|true','Reconnects to the central argument / proposition|argument|proposition|still|central|connect'],m:'“That’s a fair point: most of our data come from Germany, so we can’t claim exactly the same scale for all of Europe. We focused on Germany because it is the largest exporter affected, and the mechanism – longer delivery times stopping production – applies wherever manufacturers depend on Asian parts. So our conclusion still stands as the most likely main effect, but the size will vary by country.” Principles: I listened to the actual question (generalisation), answered concisely, acknowledged the uncertainty and reconnected the answer to our central argument.'},
{t:3,c:'R',q:'“Good slides should contain all the information, so the audience can follow even without the speaker.” Discuss, using concepts from Topic 4.',k:['Clear position (disagree)|disagree|not|position','Slides support, they do not carry the speech|support|carry|speaker|argument','Overloaded slide problems (reading, competing ideas)|overload|paragraph|read|competing|attention','Show vs say|show|say|interpret|context','Evidence must be interpreted and connected (present → interpret → connect)|interpret|connect|present|evidence','Qualification (e.g. handouts, sources visible)|however|although|but|handout|reference|apa|qualif'],m:'I disagree. Slides support the speech; they should not carry it. An overloaded slide (paragraphs to read aloud, several competing ideas, tiny details) divides attention: the audience reads instead of listening, and the speaker ends up reading. Following show vs say, the slide shows the visual or data, a short claim and brief attribution, while the speaker gives the interpretation, context, qualification and transitions – evidence does not speak for itself (present → interpret → connect). Qualification: some information must remain visible on the slide – brief source attribution and an APA 7 reference slide – and a separate handout can contain the full details for later.'},
{t:3,c:'R',q:'Your group must conclude a presentation on a news event by defending which of three business repercussions matters most. Explain how you would build a convincing conclusion, using course concepts.',k:['Compare the repercussions, not just list them|compare|not list|not merely','Criteria: scope, severity, likelihood, duration, number affected|scope|severity|likelihood|duration|number','Clear claim: which one and why|claim|which|why|most important|choose','Evidence and causal reasoning (support chain)|evidence|causal|reason|mechanism|support chain','Qualification / limits|qualif|however|although|limit|uncertain','Resolve the question, finish deliberately (guided sequence)|resolve|question|finish|synthes|deliberate'],m:'A convincing conclusion resolves the question set in the opening and finishes deliberately. It must compare the three repercussions, not just list them, using explicit criteria: scope, severity, likelihood, duration and the number of countries or firms affected. Then it states a clear claim (“Delays to manufacturing matter most”), gives the reason and the causal mechanism, supports it with the strongest evidence (attributed), and adds a qualification (e.g. “unless the route reopens within weeks”). This follows the support chain and gives the audience a reasoned judgement rather than a summary.'}];

 and merged into T / MC / EX on load, so the syllabus updates automatically. */

let UPS=[],DB=null,DBST='loading',PEND=null,BUSY=false;
function applyUploads(){T.length=0;BASE.T.forEach(x=>T.push({...x,s:x.s.slice()}));MC.length=0;MC.push(...BASE.MC);EX.length=0;EX.push(...BASE.EX);
const groups={};UPS.slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)||(a.part||0)-(b.part||0)).forEach(u=>{(groups[u.gid]=groups[u.gid]||[]).push(u)});
Object.values(groups).forEach(g=>{let idx;const u0=g[0];
 if(u0.target==='new'){idx=T.length;T.push({n:u0.topic.n,t:u0.topic.t||u0.title,d:u0.topic.d||'Temario subido',s:[],up:1})}
 else{idx=T.findIndex(x=>x.n===u0.target);if(idx<0)return}
 g.forEach(u=>{(u.s||[]).forEach(s=>T[idx].s.push({...s,nu:1}));(u.mc||[]).forEach(q=>MC.push([idx,...q]));(u.ex||[]).forEach(q=>EX.push({...q,t:idx,nu:1}))})});
if(topic>=T.length)topic=0}
const loadScript=src=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>ko(new Error('No se pudo cargar el lector de archivos.'));document.head.appendChild(s)});
async function fileText(file){const n=file.name.toLowerCase();
if(/\.(txt|md|csv)$/.test(n))return await file.text();
if(n.endsWith('.docx')){if(!window.JSZip)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');const z=await JSZip.loadAsync(await file.arrayBuffer());const xml=await z.file('word/document.xml').async('string');const d=new DOMParser().parseFromString(xml,'application/xml');const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
 return [...d.getElementsByTagNameNS(W,'p')].map(p=>[...p.getElementsByTagNameNS(W,'t')].map(t=>t.textContent).join('')).filter(Boolean).join('\n')}
if(n.endsWith('.pdf')){if(!window.pdfjsLib)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;const out=[];for(let i=1;i<=pdf.numPages;i++){const c=await(await pdf.getPage(i)).getTextContent();out.push(c.items.map(x=>x.str+(x.hasEOL?'\n':' ')).join(''))}return out.join('\n')}
throw new Error('Formato no admitido: usa PDF, Word (.docx) o .txt.')}
function upPrompt(chunk,title,i,n,tgt){const ctx=T.map(x=>`${x.n} · ${x.t}: ${x.s.map(s=>s.h.replace(/<[^>]+>/g,'')).join(' | ')}`).join('\n');
return `Convierte apuntes universitarios de la asignatura "Communication Techniques" (ESCI-UPF) en material de estudio para una app.

Temario que YA tiene la app (no repitas lo que ya está):
${ctx}

Destino: ${tgt==='new'?'un TEMA NUEVO':'añadir apartados nuevos al tema '+tgt}. Esto es la parte ${i+1} de ${n} del documento${title?' "'+title+'"':''}.

El examen final es un examen ESCRITO individual que evalúa: knowledge, analysis, application y reasoned written response. Los ejercicios deben preparar ese examen.

Tareas:
1) TEORÍA en ESPAÑOL y muy ESQUEMÁTICA (poco texto). Divide el contenido en apartados. Cada apartado: título corto ("h"); secuencias o esquemas clave si los hay ("f", p. ej. "CLAIM → REASON → EVIDENCE"); conceptos clave como pares [concepto, explicación de una línea] ("k"), conservando los términos técnicos en inglés; un ejemplo breve ("ej"); una trampa típica de examen si procede ("tr"). Usa "tbl" (primera fila = cabecera) si el contenido es una comparación o tabla. Incluye solo contenido que no esté ya en el temario.
2) EJERCICIOS en INGLÉS sobre ese contenido nuevo:
 - "ex": preguntas tipo examen escrito, unas 1-2 por apartado, mezclando los cuatro tipos: "c" = "K" (knowledge: explicar/distinguir conceptos), "A" (analysis: incluye en "cs" un caso breve inventado y realista – un email, un fragmento de discurso, una diapositiva descrita, una afirmación con datos – y pide diagnosticarlo con conceptos del curso), "P" (application: pide escribir algo – reescribir, una apertura, una tesis, una transición – y justificarlo) o "R" (reasoned response: una afirmación discutible para defender una posición). Cada una con "q" (pregunta), "k" (3-6 puntos que debe incluir una buena respuesta: cada uno es "descripción legible|palabra clave|sinónimo|…", con palabras clave en minúscula, en inglés y español, sin tildes) y "m" (respuesta modelo de 3-6 frases).
 - "mc": unas pocas preguntas tipo test de repaso rápido con 4 opciones y una correcta (índice 0-3, varía la posición) y una explicación corta.
${tgt==='new'?'3) "topic": {"t": título del tema (en inglés, como en los apuntes), "d": subtítulo corto en español}.\n':''}
Responde SOLO con JSON con esta forma:
{"topic":{"t":"...","d":"..."},"s":[{"h":"Título","f":["A → B → C"],"k":[["Concepto","explicación"]],"ej":"ejemplo","tr":"trampa","tbl":[["Col1","Col2"],["a","b"]]}],"ex":[{"c":"A","cs":"case text","q":"Question?","k":["Identifies X|x|keyword"],"m":"Model answer"}],"mc":[["Question?",["A","B","C","D"],1,"Explanation"]]}
Omite los campos que no apliquen. Si esta parte no aporta nada nuevo, devuelve {"s":[]}.

APUNTES:
"""
${chunk}

const S_=x=>typeof x==='string'?esc(x.trim()).slice(0,2500):'',isS=x=>typeof x==='string'&&x.trim()!=='';
function cleanUp(r){const o={s:[],mc:[],ex:[]};if(!r||typeof r!=='object')return o;
if(r.topic&&typeof r.topic==='object')o.topic={t:S_(r.topic.t),d:S_(r.topic.d)};
(Array.isArray(r.s)?r.s:[]).forEach(s=>{if(!s||!isS(s.h))return;const x={h:S_(s.h)};
 if(Array.isArray(s.k))x.k=s.k.filter(p=>Array.isArray(p)&&isS(p[0])).map(p=>[S_(p[0]),S_(p[1]||'')]);
 if(Array.isArray(s.f))x.f=s.f.filter(isS).map(S_);if(isS(s.ej))x.ej=S_(s.ej);if(isS(s.tr))x.tr=S_(s.tr);
 if(Array.isArray(s.tbl)&&s.tbl.length>1&&s.tbl.every(Array.isArray))x.tbl=s.tbl.map(r=>r.map(c=>S_(String(c))));o.s.push(x)});
o.mc=(Array.isArray(r.mc)?r.mc:[]).filter(q=>Array.isArray(q)&&isS(q[0])&&Array.isArray(q[1])&&q[1].length===4&&q[1].every(isS)&&Number.isInteger(q[2])&&q[2]>=0&&q[2]<4).map(q=>[S_(q[0]),q[1].map(S_),q[2],S_(q[3]||'')]);
o.ex=(Array.isArray(r.ex)?r.ex:[]).filter(q=>q&&CRIT[q.c]&&isS(q.q)&&isS(q.m)&&Array.isArray(q.k)&&q.k.some(isS)).map(q=>{const x={c:q.c,q:S_(q.q),m:S_(q.m),k:q.k.filter(isS).map(k=>{const p=k.split('|');return [esc(p[0].trim()).slice(0,200)].concat(p.slice(1).map(w=>w.toLowerCase().trim().slice(0,60)).filter(Boolean)).join('|')}).filter(k=>k.includes('|')||k.length)};if(isS(q.cs))x.cs=S_(q.cs).replace(/\n/g,'<br>');x.k=x.k.map(k=>k.includes('|')?k:k+'|'+norm(k));return x});
return o}
async function processUp(text,title,tgt,say){const paras=text.split(/\n+/),chunks=[];let cur='';
paras.forEach(p=>{if(cur.length+p.length>18000&&cur){chunks.push(cur);cur=''}cur+=p+'\n'});if(cur.trim())chunks.push(cur);
const gid='u'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),parts=[];let info=null;
for(let i=0;i<chunks.length;i++){say(`⏳ Claude está procesando la parte ${i+1} de ${chunks.length}… (puede tardar 1–2 minutos)`);
 const r=cleanUp(await SAMPLE.json(upPrompt(chunks[i],title,i,chunks.length,tgt),{modelTier:'default',cache:false}));
 if(r.topic&&r.topic.t&&!info)info=r.topic;parts.push({gid,part:i,createdAt:Date.now()+i,title,target:tgt,s:r.s,mc:r.mc,ex:r.ex})}
const n=tgt==='new'?'T'+(T.filter(x=>/^T\d+$/.test(x.n)).length+1):'';
parts.forEach(p=>{p.topic={n,t:info?info.t:esc(title),d:info?info.d:''}});return parts}
async function saveUp(parts){if(DB){for(const p of parts)await DB.collection('uploads').doc(p.gid+'-'+p.part).set(p)}
else{UPS=UPS.concat(parts.map(p=>({id:p.gid+'-'+p.part,...p})));LS.set('ct-uploads',UPS);applyUploads()}}
async function delUp(gid){const ids=UPS.filter(u=>u.gid===gid);if(DB){for(const u of ids)await DB.collection('uploads').doc(u.id).delete()}else{UPS=UPS.filter(u=>u.gid!==gid);LS.set('ct-uploads',UPS);applyUploads()}}

function upStatus(){return DB?(DBST==='ok'?'☁️ Lo que subas se guarda en la app y se ve en todos tus dispositivos.':DBST==='err'?'⚠️ No se pudo conectar con el almacenamiento de la app.':DBST==='slow'?'⏳ El almacenamiento tarda en responder…':'⏳ Conectando con el almacenamiento…'):'💾 Fuera de claude.ai lo subido se guarda solo en este navegador.'}
function upList(){const g={};UPS.forEach(u=>{(g[u.gid]=g[u.gid]||[]).push(u)});const L=Object.values(g).sort((a,b)=>b[0].createdAt-a[0].createdAt);
if(!L.length)return '<p class="mut">Todavía no has subido nada.</p>';
return L.map(p=>{const u=p[0],c=k=>p.reduce((n,x)=>n+((x[k]||[]).length),0);const dest=u.target==='new'?`Tema nuevo ${u.topic.n} · ${u.topic.t}`:`Añadido a ${u.target}`;
return `<div class="row" style="justify-content:space-between;border-top:1px solid var(--bd);padding-top:8px"><div><b>${u.title||'Apuntes'}</b><br><span class="mut">${dest} · ${c('s')} apartados · ${c('ex')} preguntas de examen · ${c('mc')} test · ${new Date(u.createdAt).toLocaleDateString()}</span></div><button data-del="${u.gid}">🗑 Eliminar</button></div>`}).join('')}
