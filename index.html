<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="campus.css">
</head><body>
<header class="top"><div class="in">
  <a class="brand" href="index.html"><i>🎓</i><span>Estudio</span></a>
  <nav class="nav">
    <a href="asignaturas.html">Asignaturas</a>
    <a href="agenda.html">Calendario</a>
    <a href="notas.html">Notas</a>
    <a href="actualizar.html">Temario nuevo</a>
  </nav>
</div></header>

<main>
<section class="hero cover conchat">
  <span class="badge" id="curso">📍 ESCI-UPF</span>
  <h1><b>Hola,</b> Martí</h1>
</section>
<section class="chat" id="chat" aria-label="Chat de estudio">
  <div class="chd"><b>💬 Pregúntame</b><span class="mut">tareas · temario · ejercicios</span><button class="clr" type="button" title="Borrar la conversación">Borrar</button></div>
  <div class="log" aria-live="polite"></div>
  <form autocomplete="off"><input type="text" placeholder="Pregúntame algo…" aria-label="Tu mensaje" enterkeyhint="send"><button class="btn pri" type="submit">Enviar</button></form>
</section>
</main>
<script src="datos.js"></script>
<script src="cal.js"></script>
<script src="chat.js"></script>

<script>
/* Curso y trimestre según la fecha. Primer curso = 2026-27. Trimestres: 1.º sep–dic · 2.º ene–mar · 3.º abr–ago. */
(function(){const d=new Date(),m=d.getMonth()+1,ini=m>=9?d.getFullYear():d.getFullYear()-1;
  const ORD=['Primer','Segundo','Tercer','Cuarto'],c=Math.min(Math.max(ini-2026,0),3),t=m>=9?0:m<=3?1:2;
  document.getElementById('curso').textContent=`📍 ESCI-UPF · ${ORD[c]} curso · ${ORD[t]} trimestre`})();
</script>
</body></html>
