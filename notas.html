<!DOCTYPE html>
<html lang="es" style="--sub:#9333ea"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calificaciones · Estudio</title>
<link rel="stylesheet" href="hub.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="claro.css">
</head><body>
<header class="top"><div class="in"><a class="brand" href="index.html"><i>🎓</i><span>Estudio</span></a><div class="tabs"><a href="asignaturas.html">Asignaturas</a><a href="agenda.html">Calendario</a><a class="on" href="notas.html">Notas</a><a href="actualizar.html">Temario nuevo</a></div></div></header>
<main style="max-width:760px">

<h1>🎓 Calificaciones</h1>
<p class="mut" id="upd"></p>
<div class="grid" id="res" style="margin-top:14px"></div>
<h2>Detalle por asignatura</h2>
<div id="det"></div>
<p class="mut">La media es la de lo que ya está calificado. Cuando AulaESCI no da una media propia, es una media simple: la nota final puede cambiar según el peso de cada prueba.</p>
</main>
<script src="datos.js"></script>
<script>
const D=DATOS,$=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const n2=x=>x.toFixed(2).replace('.',',');
const cls=x=>x>=7?'ok':x>=5?'mid':'ko';
const media=a=>a.media!=null?a.media:(a.items.length?a.items.reduce((s,i)=>s+i.nota,0)/a.items.length:null);
const d=new Date(D.actualizado);
$('#upd').textContent='Leído de AulaESCI el '+d.toLocaleDateString('es-ES',{day:'numeric',month:'long'})+' a las '+d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})+'. No se actualiza solo: pídele a Claude que lo vuelva a leer.';
$('#res').innerHTML=D.notas.map(a=>{const x=D.asig[a.asig],m=media(a);
  return `<a class="subj" href="#n-${a.asig}" style="--c:${x.color}"><span class="nm">${x.emoji} ${esc(x.nombre)}</span>
  <span class="big ${m==null?'':cls(m)}">${m==null?'–':n2(m)}</span>
  <span class="pg">${a.items.length} nota${a.items.length===1?'':'s'} · media de momento</span></a>`}).join('');
$('#det').innerHTML=D.notas.map(a=>{const x=D.asig[a.asig],m=media(a);
  return `<div class="card" id="n-${a.asig}" style="border-left:5px solid ${x.color}"><h3>${x.emoji} ${esc(x.nombre)}</h3>
  <table class="nt">${a.items.map(i=>`<tr><td>${esc(i.n)}${i.det?`<br><span class="mut">${esc(i.det)}</span>`:''}</td><td class="num ${cls(i.nota)}">${n2(i.nota)}</td></tr>`).join('')}
  <tr class="tot"><td>Media de momento${a.mediaTxt?`<br><span class="mut">${esc(a.mediaTxt)}</span>`:''}</td><td class="num ${m==null?'':cls(m)}">${m==null?'–':n2(m)}</td></tr></table>
  ${a.pend&&a.pend.length?`<p class="mut" style="margin-top:8px"><b>Aún sin nota:</b> ${a.pend.map(esc).join(' · ')}</p>`:''}</div>`}).join('');
</script>
</body></html>
