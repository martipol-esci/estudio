<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Français A1 · Práctica</title>
<style>
:root{--bg:#fafaf7;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--bd:#e2e0d8;--ac:#2f5bd8;--ok:#1d8a4b;--ko:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--fg:#ececea;--mut:#9a9a94;--card:#1f2024;--bd:#33343a;--ac:#7c9cff;--ok:#4cc27f;--ko:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16171a;--fg:#ececea;--mut:#9a9a94;--card:#1f2024;--bd:#33343a;--ac:#7c9cff;--ok:#4cc27f;--ko:#ff7b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:19px;margin:8px 0}h3{font-size:16px;margin:0 0 6px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:10px;cursor:pointer}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button.ghost{background:transparent}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0;overflow-x:auto}
.mut{color:var(--mut);font-size:14px}.ok{color:var(--ok)}.ko{color:var(--ko)}
input{font:inherit;width:100%;box-sizing:border-box;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--bd);padding:4px 8px;text-align:left}
.bub{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin:8px 0}
.bot{border-left:4px solid var(--ac)}
.rt{color:#d9534f;font-size:20px;font-weight:700;margin:0 0 6px}.inst{font-weight:700;border:3px solid #f2c200;border-radius:6px;padding:8px 12px;margin:8px 0}.b{color:var(--ac)}
.tbl th{background:rgba(120,140,200,.2)}.tbl td,.tbl th{border:1px solid var(--bd)}.fr{border:3px solid #e02020;border-radius:6px;padding:8px 12px;margin:8px 0;display:grid;grid-template-columns:1fr 1fr;gap:2px 16px}
button.w{padding:4px 9px;margin:2px;border-radius:8px}button.g{border-color:var(--ok);color:var(--ok)}button.r{border-color:var(--ko);color:var(--ko);font-weight:700}
.tip{border-top:1px solid var(--bd);padding:6px 0;font-size:15px}select{font:inherit;padding:6px;border-radius:8px;background:var(--card);color:var(--fg);border:1px solid var(--bd);max-width:100%}

.ngt{font-weight:700;color:var(--ac);margin:14px 0 6px;font-size:15px}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:6px}
.nc{display:flex;align-items:baseline;gap:6px;background:rgba(120,140,200,.10);border:1px solid var(--bd);border-radius:10px;padding:7px 8px;cursor:pointer;line-height:1.25;word-break:break-word}
.nc:active{background:rgba(120,140,200,.28)}
.nc .n{font-weight:800;color:#d9534f;min-width:20px;text-align:right;font-variant-numeric:tabular-nums}
.nc .w{font-size:14px}
.home{display:inline-block;margin:2px 0 6px;color:var(--ac);text-decoration:none;font-size:14.5px;font-weight:600}.home:hover{text-decoration:underline}</style></head><body><main>
<a class="home" href="index.html">&larr; Inicio</a><h1>🇫🇷 Français A1</h1>
<nav id="nav"></nav>
<div id="view"></div>
</main>
<script>
const $=s=>document.querySelector(s);
const norm=s=>s.toLowerCase().replace(/[’‘`]/g,"'").normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/œ/g,'oe').replace(/[?!.,;:«»"]/g,'').replace(/\s+/g,' ').trim();
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
let VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang));let sv='';try{sv=localStorage.getItem('fr-voice')||''}catch(e){}
const sc=v=>(v.name===sv?9:0)+(/natural|neural|online|premium|enhanced|améliorée|google|am[eé]lie|thomas|audrey|hortense|denise|henri|eloise|vivienne|remy/i.test(v.name)?2:0)+(/fr-FR/i.test(v.lang)?1:0);VOICE=vs.sort((a,b)=>sc(b)-sc(a))[0]||null}catch(e){}}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}
function say(t,r){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';if(VOICE)u.voice=VOICE;u.rate=r||.9;speechSynthesis.speak(u)}catch(e){}}
function listenOld(cb,err){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){err('Tu navegador no admite reconocimiento de voz (prueba Chrome o Safari). Puedes escribir la respuesta.');return}
const r=new R();r.lang='fr-FR';r.interimResults=false;r.onresult=e=>cb(e.results[0][0].transcript);r.onerror=e=>err('No te he oído bien ('+e.error+'). Inténtalo otra vez o escríbelo.');try{r.start()}catch(e){err('No se pudo activar el micrófono.')}}
let P={};try{P=JSON.parse(localStorage.getItem('fr-prog')||'{}')}catch(e){}
function rec(c,ok){const x=P[c]=P[c]||{ok:0,n:0};x.n++;if(ok)x.ok++;try{localStorage.setItem('fr-prog',JSON.stringify(P))}catch(e){}}

/* ===== DATOS (aquí se añade la teoría nueva) ===== */
const U=['zéro','un','deux','trois','quatre','cinq','six','sept','huit','neuf','dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf','vingt'];
const T={30:'trente',40:'quarante',50:'cinquante'};
function num(n){if(n<=20)return U[n];const d=n%10,t=n-d;if(t===20)return d?'vingt'+(d===1?' et un':'-'+U[d]):'vingt';return T[t]+(d?(d===1?' et un':'-'+U[d]):'')}
const CJ={être:[['je','suis'],['tu','es'],['il/elle','est'],['nous','sommes'],['vous','êtes'],['ils/elles','sont']],
avoir:[['j’','ai'],['tu','as'],['il/elle','a'],['nous','avons'],['vous','avez'],['ils/elles','ont']],
aller:[['je','vais'],['tu','vas'],['il/elle','va'],['nous','allons'],['vous','allez'],['ils/elles','vont']]};
const NAT=[['américain','américaine'],['français','française'],['allemand','allemande'],['chinois','chinoise'],['australien','australienne'],['coréen','coréenne'],['argentin','argentine'],['espagnol','espagnole'],['grec','grecque'],['suisse','suisse'],['indien','indienne'],['marocain','marocaine'],['sénégalais','sénégalaise'],['colombien','colombienne'],['polonais','polonaise'],['danois','danoise'],['belge','belge'],['brésilien','brésilienne'],['italien','italienne'],['portugais','portugaise'],['anglais','anglaise']];
const PRO=[['assistant','assistante'],['directeur','directrice'],['vendeur','vendeuse'],['infirmier','infirmière'],['informaticien','informaticienne'],['boulanger','boulangère'],['coiffeur','coiffeuse'],['serveur','serveuse'],['plombier','plombière'],['boucher','bouchère'],['mécanicien','mécanicienne'],['architecte','architecte'],['secrétaire','secrétaire']];
const POS=[['nom','mon'],['prénom','mon'],['pays','mon'],['numéro de téléphone','mon'],['formulaire','mon'],['adresse','mon','femenino con vocal → mon'],['entreprise','mon','femenino con vocal → mon'],['date de naissance','ma'],['profession','ma'],['nationalité','ma'],['carte d’identité','ma'],['photo','ma'],['passeport','mon'],['visa','mon'],['portefeuille','mon'],['carte de crédit','ma'],['argent','mon'],['ordinateur','mon'],['caméra','ma'],['téléphone','mon'],['valise','ma'],['coordonnées','mes','plural → mes'],['enfants','mes','plural → mes']];
const TV=[['Vous rencontrez le directeur général','vous'],['Vous parlez avec une personne de votre service','tu'],['Votre supérieur dit « On peut se tutoyer ? »','tu'],['Votre collègue est beaucoup plus âgé que vous','vous'],['Vous parlez à un client','vous'],['Vous parlez à un collègue proche','tu'],['Vous parlez à une personne inconnue','vous'],['Vous parlez à un ami','tu']];
const VOC=[['abuelo','mon grand-père'],['abuela','ma grand-mère'],['padre','mon père'],['madre','ma mère'],['hermano','mon frère'],['hermana','ma sœur'],['marido','mon mari'],['esposa','ma femme'],['hijo','mon fils'],['hija','ma fille'],['nieto','mon petit-fils'],['nieta','ma petite-fille'],['almohada','un oreiller'],['periódico','un journal'],['auriculares','des écouteurs'],['antifaz','un masque'],['manta','une couverture'],['vaso de agua','un verre d’eau'],['pasaporte','un passeport'],['cartera','un portefeuille'],['maleta','une valise'],['tarjeta de crédito','une carte de crédit'],['dinero','l’argent'],['ordenador','un ordinateur'],['soltero/a','célibataire'],['casado/a','marié'],['divorciado/a','divorcé'],['viudo/a','veuf'],['nombre de familia (apellido)','nom de famille'],['dirección de correo electrónico','adresse électronique'],['¿Cómo se escribe?','comment ça s’écrit']];
const C={
verbes:{l:'Être · Avoir · Aller',g:()=>Object.entries(CJ).flatMap(([v,t])=>t.map(([p,f])=>({c:'verbes',p:`${v.toUpperCase()}: <b>${p}</b> …`,a:[f]})))},
nat:{l:'Nacionalidades (fem.)',g:()=>NAT.map(([m,f])=>({c:'nat',p:`Femenino de <b>${m}</b>`,a:[f]}))},
pro:{l:'Profesiones (fem.)',g:()=>PRO.map(([m,f])=>({c:'pro',p:`Femenino de <b>${m}</b>`,a:[f]}))},
pos:{l:'Mon / Ma / Mes',g:()=>POS.map(([n,a,h])=>({c:'pos',p:im(n)+`<b>…</b> ${n}`,a:[a],h}))},
tv:{l:'Tu o Vous',g:()=>TV.map(([s,a])=>({c:'tv',p:`${s}. ¿<b>tu</b> o <b>vous</b>?`,a:[a]}))},
nb:{l:'Números 1–50',g:()=>Array.from({length:50},(_,i)=>({c:'nb',p:`Escribe en letras: <b>${i+1}</b>`,a:[num(i+1)],h:'21, 31, 41… llevan « et un »'}))},
voc:{l:'Vocabulario',g:()=>VOC.map(([es,fr])=>({c:'voc',p:im(fr)+`¿Cómo se dice <b>${es}</b>?`,a:[fr]}))}};
const PH=[['Bonjour, comment allez-vous ?','Hola, ¿cómo está usted?'],['Je vais bien, merci. Et vous ?','Estoy bien, gracias. ¿Y usted?'],['Salut ! Tu vas bien ?','¡Hola! ¿Qué tal?'],['Je m’appelle Claire.','Me llamo Claire.'],['Mon nom de famille est Boitard.','Mi apellido es Boitard.'],['Je suis de Barcelone.','Soy de Barcelona.'],['J’ai dix-neuf ans.','Tengo diecinueve años.'],['Je suis étudiant.','Soy estudiante.'],['Quelle est votre nationalité ?','¿Cuál es su nacionalidad?'],['Quelle est votre profession ?','¿Cuál es su profesión?'],['Comment ça s’écrit ?','¿Cómo se escribe?'],['Vous avez une adresse électronique ?','¿Tiene una dirección de correo electrónico?'],['Je vous présente mon collègue.','Le presento a mi compañero.'],['Enchanté.','Encantado.'],['Il est responsable marketing chez Nofisa.','Es responsable de marketing en Nofisa.'],['Elle est directrice de la communication.','Es directora de comunicación.'],['J’ai un frère et une sœur.','Tengo un hermano y una hermana.'],['Je suis enfant unique.','Soy hijo único.'],['Mon père s’appelle Pablo, il est ingénieur.','Mi padre se llama Pablo, es ingeniero.'],['Un café, s’il vous plaît.','Un café, por favor.'],['Merci beaucoup, au revoir.','Muchas gracias, adiós.']];
const DL=[['Bonjour, comment allez-vous ?',/(je vais|ca va|bien)/,'Je vais bien, merci. Et vous ?'],['Quel est votre nom ?',/(je m'appelle|mon nom)/,'Je m’appelle Marc.'],['Quelle est votre nationalité ?',/je suis \w+/,'Je suis espagnol.'],['Quelle est votre profession ?',/je suis \w+/,'Je suis étudiant.'],['Quel âge avez-vous ?',/j'ai \w+( \w+)? ans/,'J’ai dix-neuf ans.'],['Vous êtes de quelle ville ?',/je suis (de|d') ?\w+/,'Je suis de Barcelone.'],['Vous avez des frères et sœurs ?',/(j'ai|je n'ai|enfant unique)/,'J’ai un frère. / Je suis enfant unique.'],['Comment ça s’écrit, votre nom ?',/\w/,'M.A.R.C. (dis les lettres une par une)'],['Vous avez une adresse électronique ?',/(oui|c'est)/,'Oui, c’est marc arobase gmail point com.'],['Au revoir !',/(au revoir|a bientot|merci)/,'Au revoir, à bientôt !']];
const TH=[
['Les verbes être, avoir, aller',`<table><tr><th>personne</th><th>être</th><th>avoir</th><th>aller</th></tr>${CJ.être.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${CJ.avoir[i][1]}</td><td>${CJ.aller[i][1]}</td></tr>`).join('')}</table><p class="mut"><b>Avoir</b>: edad (j’ai 19 ans), posesión, sensación (j’ai faim), presencia (il y a). <b>Aller</b>: ça va ? / comment allez-vous ?</p>`],
['Nacionalidades y profesiones: masculino → femenino',`<p>-ain/-ais/-and/-ois/-in/-ol → <b>+e</b> · -ien/-éen → <b>+ne</b> · -c → <b>+que</b> (grec → grecque) · -e no cambia (suisse, belge).</p><p>-ant → +e · -teur → <b>-trice</b> · -eur → <b>-euse</b> · -er → <b>-ère</b> · -ien → <b>-ienne</b> · -e no cambia (architecte, secrétaire).</p><p class="mut">Frases: Il est de nationalité indienne · Elle est ingénieure.</p>`],
['Un / une / des  ·  Mon / ma / mes / votre / vos',`<p>Masc. sing.: <b>un</b> / <b>mon</b> / <b>votre</b> · Fem. sing.: <b>une</b> / <b>ma</b> / <b>votre</b> · Plural: <b>des</b> / <b>mes</b> / <b>vos</b>.</p><p>Femenino que empieza por vocal: <b>mon</b> adresse, <b>mon</b> entreprise.</p>`],
['Tu o vous',`<p><b>Vous</b>: persona desconocida o poco conocida, director, cliente, persona mayor. <b>Tu</b>: colega cercano, compañero de servicio, amigos, o si tu superior te lo propone.</p><p>Bonjour (de día) · Bonsoir (de noche) · Salut (informal).</p>`],
['Saludar, presentar y preguntar datos',`<p>Comment allez-vous ? / Comment vas-tu ? / Ça va ? → Je vais bien, merci.<br>Je vous présente… / Je te présente… → Enchanté(e).<br>Quel est votre nom ? · Quelle est votre nationalité / profession / adresse ? · Comment ça s’écrit ?<br>Il/Elle est responsable marketing <b>chez</b> Nofisa · ingénieur <b>dans</b> une entreprise <b>à</b> Toulouse.</p>`],
['Lugares: à, dans, chez',`<p><b>à</b> + ciudad (à Toulouse) · <b>dans</b> + lugar (dans une entreprise) · <b>chez</b> + persona/empresa (chez Nofisa).</p>`],
['Familia y situación de famille',`<p>mon grand-père, ma grand-mère → mes grands-parents · mon père, ma mère → mes parents · mon frère, ma sœur · mon mari, ma femme · mon fils, ma fille → mes enfants · mon petit-fils, ma petite-fille.</p><p>Je suis célibataire / marié(e) / séparé(e) / divorcé(e) / veuf, veuve. Je suis enfant unique.</p>`],
['Números',`<p>${Array.from({length:21},(_,i)=>i+1).map(n=>`${n} ${num(n)}`).join(' · ')}<br>30 trente · 40 quarante · 50 cinquante · 21 vingt et un · 22 vingt-deux…</p>`],
['Deletreo (email)',`<p>@ arobase · . point · - tiret · _ tiret du bas · minuscule / majuscule · é accent aigu · è accent grave · ê circonflexe · ç cédille · ï tréma · l’ apostrophe · sans espace / tout attaché.</p>`]];

/* ===== UI ===== */
const tabs=[['learn','Aprender'],['quiz','Ejercicios'],['say','Pronunciar'],['talk','Conversar'],['mic','🔧 Micro']];
let tab='learn',qz=null,di=0;
function nav(){$('#nav').innerHTML=tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" data-k="${k}">${l}</button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.k;qz=null;di=0;cv=null;window.WANT=null;render()})}
function render(){nav();({learn:learn2,quiz,say:sayTab2,talk,mic:micTab})[tab]()}
function learn(){$('#view').innerHTML=TH.map(([t,h])=>`<div class="card"><h3>${t}</h3>${h}</div>`).join('')}
function quizOld(){const v=$('#view');
if(!qz){const acc=k=>P[k]?` <span class="mut">(${Math.round(100*P[k].ok/P[k].n)}% · ${P[k].n})</span>`:'';
v.innerHTML=`<p>Elige un tema (10 preguntas al azar):</p><div class="row"><button class="pri" data-c="mix">🎲 Mezcla</button>${Object.entries(C).map(([k,o])=>`<button data-c="${k}">${o.l}${acc(k)}</button>`).join('')}</div><p class="mut">Se acepta sin acentos. Puedes responder con el micro (🎤).</p>`;
v.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=b.dataset.c;const all=c==='mix'?Object.values(C).flatMap(o=>o.g()):C[c].g();qz={qs:shuf(all).slice(0,10),i:0,s:0};showQ()});return}showQ()}
function showQOld(){const v=$('#view'),q=qz.qs[qz.i];
if(!q){v.innerHTML=`<div class="card"><h2>Resultado: ${qz.s}/${qz.qs.length}</h2><button class="pri" id="again">Otra ronda</button></div>`;$('#again').onclick=()=>{qz=null;quiz()};return}
v.innerHTML=`<p class="mut">Pregunta ${qz.i+1}/${qz.qs.length}</p><div class="card"><h2>${q.p}</h2><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Tu respuesta en francés"><div class="row"><button class="pri" id="chk">Comprobar</button><button class="ghost" id="mic">🎤 Decirlo</button></div><div id="fb"></div></div>`;
const inp=$('#ans');inp.focus();let done=false;
const check=()=>{if(done){qz.i++;showQ();return}const val=inp.value;if(!val.trim())return;done=true;const ok=q.a.some(a=>norm(a)===norm(/^\d+$/.test(val.trim())?num(+val):val));rec(q.c,ok);if(ok)qz.s++;
$('#fb').innerHTML=`<p class="${ok?'ok':'ko'}">${ok?'✓ Correcto':'✗ Respuesta correcta'}: <b>${esc(q.a[0])}</b> <button class="ghost" id="sp">🔊</button></p>${q.h&&!ok?`<p class="mut">Pista: ${q.h}</p>`:''}`;$('#sp').onclick=()=>say(q.a[0]);$('#chk').textContent='Siguiente'};
$('#chk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
$('#mic').onclick=()=>{$('#mic').textContent='🎤 Escuchando…';listen(t=>{inp.value=t;$('#mic').textContent='🎤 Decirlo'},m=>{$('#mic').textContent='🎤 Decirlo';$('#fb').innerHTML=`<p class="ko">${m}</p>`})}}
function sayTab(){$('#view').innerHTML=`<p class="mut">Pulsa 🔊 para escuchar y 🎤 para repetir. Te doy un porcentaje de parecido.</p>`+PH.map(([f,e],i)=>`<div class="card"><b>${f}</b><br><span class="mut">${e}</span><div class="row"><button data-s="${i}">🔊</button><button data-m="${i}">🎤</button></div><div id="r${i}"></div></div>`).join('');
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>say(PH[b.dataset.s][0]));
document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=b.dataset.m,r=$('#r'+i);r.textContent='Escuchando…';
listen(t=>{const a=norm(PH[i][0]).split(' '),h=norm(t).split(' ');const hit=a.filter(w=>h.includes(w)).length,p=Math.round(100*hit/a.length);rec('voz',p>=80);r.innerHTML=`<span class="${p>=80?'ok':'ko'}">${p}%</span> · he oído: «${esc(t)}»`},m=>{r.innerHTML=`<span class="ko">${m}</span>`})})}
function talkOld(){const v=$('#view'),d=DL[di];
if(!d){v.innerHTML=`<div class="card"><h2>¡Conversación terminada!</h2><button class="pri" id="re">Repetir</button></div>`;$('#re').onclick=()=>{di=0;talk()};return}
v.innerHTML=`<p class="mut">Rol: eres un candidato en una entrevista. Responde en francés (voz o texto). ${di+1}/${DL.length}</p><div class="bub bot">${d[0]} <button class="ghost" id="sp">🔊</button></div><input id="ans" autocomplete="off" autocapitalize="off" placeholder="Tu respuesta"><div class="row"><button class="pri" id="chk">Responder</button><button class="ghost" id="mic">🎤</button></div><div id="fb"></div>`;
say(d[0]);$('#sp').onclick=()=>say(d[0]);const inp=$('#ans');let done=false;
const check=()=>{if(done){di++;talk();return}if(!inp.value.trim())return;done=true;const ok=d[1].test(norm(inp.value));rec('conv',ok);
$('#fb').innerHTML=`<p class="${ok?'ok':'ko'}">${ok?'✓ Muy bien':'Casi: prueba con una frase completa'}</p><p class="mut">Ejemplo: ${d[2]}</p>`;$('#chk').textContent='Siguiente'};
$('#chk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
$('#mic').onclick=()=>listen(t=>{inp.value=t},m=>{$('#fb').innerHTML=`<p class="ko">${m}</p>`})}
/* ===== TEORÍA con el formato de los PDFs ===== */

T9("Vous mangez dans l'avion ?","¿Come usted en el avión?","Para decir que NO se usa «ne… pas» alrededor del verbo: «Je ne mange pas». Delante de vocal: «n'»: «Je n'aime pas».","(oui|non|je mange|je ne mange|je n'ai)","Non, je ne mange pas dans l'avion.","No, no como en el avión."),
T9("Vous préférez l'avion ou le train ?","¿Prefiere el avión o el tren?","«Je préfère + lo que eliges»: «Je préfère le train».","(je prefere|j'aime mieux|le train|l'avion)","Je préfère le train.","Prefiero el tren."),
T9("Vous écoutez de la musique ?","¿Escucha música?","«Oui, j'écoute…» o «Non, je n'écoute pas…». Puedes añadir la frecuencia: souvent, parfois…","(oui|non|j'ecoute|je n'ecoute)","Oui, j'écoute souvent de la musique.","Sí, escucho música a menudo."),
T9("Vous avez peur en avion ?","¿Tiene miedo en el avión?","«Avoir peur» = tener miedo (se usa AVOIR). «J'ai peur» / «Je n'ai pas peur».","(j'ai peur|je n'ai pas peur|oui|non)","Non, je n'ai pas peur en avion.","No, no tengo miedo en el avión.","avoir peur=tener miedo")
]},
{t:"Presentar a un colega",tag:"t",d:"Que te presenten, hablar del trabajo y despedirte.",turns:[
T9("Je vous présente Claire, ma collègue.","Le presento a Claire, mi compañera.","Cuando te presentan a alguien se responde «Enchanté» (si eres hombre) o «Enchantée» (si eres mujer).","(enchante|bonjour|ravi)","Enchanté, Claire.","Encantado, Claire."),
T9("Bonjour ! Vous travaillez dans quelle entreprise ?","¡Hola! ¿En qué empresa trabaja?","«Je travaille chez + empresa». Si eres estudiante: «Je suis étudiant(e)».","(je travaille|je suis|chez|j'etudie)","Je suis étudiant à Barcelone.","Soy estudiante en Barcelona."),
T9("Et vous êtes dans quel secteur ?","¿Y en qué sector está usted?","«Je suis dans + sector»: la communication, le commerce, l'informatique… (Si estudias: «Je suis étudiant»).","(je suis|je travaille|dans|j'etudie)","Je suis dans la communication.","Estoy en el sector de la comunicación.","la communication=la comunicación;le commerce=el comercio;l'informatique=la informática"),
T9("Vous parlez anglais ?","¿Habla inglés?","«Oui, je parle…» y los idiomas: espagnol, anglais, catalan, français. Si no: «Non, je ne parle pas…».","(oui|non|je parle|je ne parle)","Oui, je parle espagnol et anglais.","Sí, hablo español e inglés.","parler=hablar;l'espagnol=el español;l'anglais=el inglés"),
T9("Vous habitez à Paris ?","¿Vive usted en París?","Ciudad → «à»; país femenino → «en»; masculino → «au». Ejemplo: «J'habite à Barcelone, en Espagne».","(non|oui|j'habite)","Non, j'habite à Barcelone, en Espagne.","No, vivo en Barcelona, en España."),
T9("Enchantée. À bientôt !","Encantada. ¡Hasta pronto!","Despídete: «Au revoir» o «À bientôt».","(au revoir|a bientot|merci|enchante|bonne)","Au revoir, à bientôt !","Adiós, ¡hasta pronto!")
]},
{t:"Mi familia",tag:"t",d:"Estado civil, hijos, padres y abuelos.",turns:[
T9("Vous êtes marié(e) ?","¿Está casado/a?","«Je suis célibataire / marié(e) / divorcé(e) / veuf (veuve)». Es la «situation de famille».","(je suis|oui|non|celibataire|marie)","Non, je suis célibataire.","No, soy soltero.","célibataire=soltero/a;marié(e)=casado/a;divorcé(e)=divorciado/a"),
T9("Vous avez des enfants ?","¿Tiene hijos?","«J'ai un fils / une fille / deux enfants». Si no: «Je n'ai pas d'enfants».","(j'ai|je n'ai|oui|non)","Non, je n'ai pas d'enfants.","No, no tengo hijos."),
T9("Comment s'appelle votre père ?","¿Cómo se llama su padre?","«Mon père s'appelle + nombre». Usa «mon» con masculino (père) y «ma» con femenino (mère).","(mon pere|s'appelle|il s'appelle)","Mon père s'appelle Pablo.","Mi padre se llama Pablo."),
T9("Quelle est sa profession ?","¿Cuál es su profesión?","«Il est + profesión» (él) o «Elle est…» (ella), sin artículo: «Il est ingénieur».","(il est|elle est|il travaille|mon pere est)","Il est ingénieur.","Es ingeniero."),
T9("Et votre mère, quel âge a-t-elle ?","¿Y su madre, qué edad tiene?","La edad con AVOIR: «Elle a + número + ans» (ella).","(elle a|ma mere a|ans)","Elle a cinquante ans.","Tiene cincuenta años."),
T9("Vous avez des grands-parents ?","¿Tiene abuelos?","«Oui, j'ai mes grands-parents / un grand-père / une grand-mère». Si no: «Non, je n'ai pas…».","(oui|non|j'ai|mes grands|je n'ai)","Oui, j'ai ma grand-mère.","Sí, tengo a mi abuela.","le grand-père=el abuelo;la grand-mère=la abuela;les grands-parents=los abuelos")
]},
{t:"Países y ciudades",tag:"t",d:"En, à, au, aux: dónde vives y dónde están las cosas.",turns:[
T9("Vous habitez où ?","¿Dónde vive usted?","«J'habite à + ciudad» (à Barcelone) o «J'habite en + país femenino» (en Espagne).","j'habite (a|en|au|aux)","J'habite à Barcelone.","Vivo en Barcelona."),
T9("Barcelone est en France, non ?","Barcelona está en Francia, ¿no?","Corrígele: «Non, Barcelone est en Espagne». España es femenino (la Espagne), por eso «en».","(non|oui|est en|espagne)","Non, Barcelone est en Espagne.","No, Barcelona está en España."),
T9("Où est la tour Eiffel ?","¿Dónde está la torre Eiffel?","Ciudad → «à»: «Elle est à Paris». Y puedes añadir «en France».","(a paris|paris|elle est|est a)","Elle est à Paris, en France.","Está en París, en Francia."),
T9("Où est Amsterdam ?","¿Dónde está Ámsterdam?","Los Países Bajos son plural (les Pays-Bas), así que se usa «aux»: «Amsterdam est aux Pays-Bas».","(pays-bas|pays bas|aux)","Amsterdam est aux Pays-Bas.","Ámsterdam está en los Países Bajos."),
T9("Vous voyagez au Japon ou en Italie ?","¿Viaja a Japón o a Italia?","Japón es masculino → «au Japon»; Italia es femenino → «en Italie».","(au japon|en italie|japon|italie|je voyage)","Je voyage en Italie.","Viajo a Italia."),
T9("Vous allez aux États-Unis cet été ?","¿Va a Estados Unidos este verano?","«Oui, je vais aux États-Unis» (plural → «aux») o «Non, je ne vais pas…». Aquí «aller» = ir.","(oui|non|je vais|aux etats|etats-unis)","Oui, je vais aux États-Unis.","Sí, voy a Estados Unidos.","cet été=este verano")
]},
{t:"En el café",tag:"x",d:"Pedir una bebida y algo de comer, y pagar.",turns:[
T9("Bonjour ! Vous désirez ?","¡Buenos días! ¿Qué desea?","El camarero te pregunta qué quieres. Pide con «Je voudrais + lo que quieras» (quisiera) o «Un café, s'il vous plaît». Termina siempre con «s'il vous plaît».","(je voudrais|je prends|un |une |s'il vous plait|de l'eau)","Je voudrais un café, s'il vous plaît.","Quisiera un café, por favor.","je voudrais=quisiera;s'il vous plaît=por favor;un café=un café;un thé=un té;un jus d'orange=un zumo de naranja;une eau=un agua"),
T9("Avec du sucre ou avec du lait ?","¿Con azúcar o con leche?","Elige con «avec» (con) o «sans» (sin): «Avec du lait», «Sans sucre». Si no quieres nada: «Non, merci».","(sucre|lait|sans|avec|merci)","Avec du lait, s'il vous plaît.","Con leche, por favor.","avec=con;sans=sin;du sucre=azúcar;du lait=leche"),
T9("Vous mangez quelque chose ?","¿Va a comer algo?","Di sí con lo que quieres («Oui, un croissant») o no con «Non, merci».","(oui|non|croissant|sandwich|gateau|merci|je voudrais|je prends)","Oui, un croissant, s'il vous plaît.","Sí, un cruasán, por favor.","un croissant=un cruasán;un gâteau=un pastel;un sandwich=un sándwich;quelque chose=algo"),
T9("Vous payez par carte ou en espèces ?","¿Paga con tarjeta o en efectivo?","Elige una: «Par carte» (con tarjeta) o «En espèces» (en efectivo).","(carte|especes|cash)","Par carte, s'il vous plaît.","Con tarjeta, por favor.","par carte=con tarjeta;en espèces=en efectivo;payer=pagar"),
T9("Voilà ! Bonne journée !","¡Aquí tiene! ¡Que tenga un buen día!","Da las gracias y devuelve el deseo con «Vous aussi» (igualmente).","(merci|vous aussi|au revoir|bonne journee)","Merci, vous aussi ! Au revoir.","Gracias, ¡igualmente! Adiós.","bonne journée=que tenga un buen día;vous aussi=igualmente")
]},
{t:"En la panadería",tag:"x",d:"Comprar pan y bollería en una tienda.",turns:[
T9("Bonjour, je peux vous aider ?","Hola, ¿puedo ayudarle?","Saluda y pide con «Je voudrais + lo que quieras»: «Bonjour, je voudrais une baguette».","(bonjour|je voudrais|je prends|une |un |des )","Bonjour, je voudrais une baguette, s'il vous plaît.","Hola, quisiera una barra de pan, por favor.","une baguette=una barra de pan;je peux vous aider ?=¿puedo ayudarle?"),
T9("Et avec ceci ?","¿Algo más? (literalmente: ¿y con esto?)","Añade algo («Et deux croissants») o termina con «C'est tout, merci».","(c'est tout|et |un |une |deux |trois |merci|non)","C'est tout, merci.","Eso es todo, gracias.","c'est tout=eso es todo;deux croissants=dos cruasanes"),
T9("Ça fait trois euros vingt.","Son tres euros veinte.","Da el dinero diciendo «Voilà» (aquí tiene) o «Tenez» (tome), y da las gracias.","(voila|tenez|merci|voici)","Voilà, tenez. Merci !","Aquí tiene. ¡Gracias!","voilà=aquí tiene;tenez=tome;ça fait…=son…"),
T9("Merci ! Bonne journée !","¡Gracias! ¡Que tenga un buen día!","Responde con «Merci, vous aussi» y despídete.","(merci|vous aussi|bonne journee|au revoir)","Merci, vous aussi ! Au revoir.","Gracias, ¡igualmente! Adiós.")
]},
{t:"Pedir direcciones",tag:"x",d:"Preguntar cómo llegar a un sitio y entender la respuesta.",turns:[
T9("Bonjour ! Vous cherchez quelque chose ?","¡Hola! ¿Busca algo?","Di qué lugar buscas: «Je cherche + lugar»: la gare (la estación), le métro, la pharmacie…","(je cherche|ou est|gare|metro|pharmacie)","Je cherche la gare.","Busco la estación.","je cherche=busco;la gare=la estación;le métro=el metro;la pharmacie=la farmacia"),
T9("La gare ? Allez tout droit, puis tournez à gauche.","¿La estación? Vaya todo recto y luego gire a la izquierda.","Repite lo que has entendido para confirmar y da las gracias: «Tout droit, puis à gauche. Merci !».","(merci|tout droit|gauche|d'accord|ok)","D'accord, tout droit puis à gauche. Merci !","Vale, todo recto y luego a la izquierda. ¡Gracias!","tout droit=todo recto;à gauche=a la izquierda;à droite=a la derecha;tournez=gire;puis=luego"),
T9("C'est à dix minutes à pied. Vous avez compris ?","Está a diez minutos andando. ¿Ha entendido?","Contesta «Oui, j'ai compris» o, si no, pide que lo repita: «Pouvez-vous répéter, s'il vous plaît ?».","(oui|non|compris|repeter|d'accord|merci)","Oui, j'ai compris. Merci beaucoup !","Sí, lo he entendido. ¡Muchas gracias!","j'ai compris=he entendido;pouvez-vous répéter ?=¿puede repetir?;à pied=a pie"),
T9("Bonne journée !","¡Que tenga un buen día!","Despídete: «Merci, vous aussi ! Au revoir».","(merci|au revoir|bonne journee|vous aussi)","Merci, vous aussi ! Au revoir.","Gracias, ¡igualmente! Adiós.")
]},
{t:"En el hotel",tag:"x",d:"Hacer el check-in: reserva, nombre y noches.",turns:[
T9("Bonsoir, vous avez une réservation ?","Buenas noches, ¿tiene una reserva?","«Oui, j'ai une réservation au nom de + apellido». Si no la tienes: «Non, je voudrais une chambre».","(oui|non|reservation|chambre|je voudrais|j'ai)","Oui, j'ai une réservation au nom de Garcia.","Sí, tengo una reserva a nombre de García.","une réservation=una reserva;au nom de=a nombre de;une chambre=una habitación"),
T9("Quel est votre nom de famille, s'il vous plaît ?","¿Cuál es su apellido, por favor?","«Je m'appelle…» o «Mon nom est…». Si te piden deletrearlo: «Comment ça s'écrit ?» ya lo conoces.","(je m'appelle|mon nom|c'est|au nom)","Je m'appelle Garcia.","Me llamo García.","le nom de famille=el apellido"),
T9("Pour combien de nuits ?","¿Para cuántas noches?","Contesta «Pour + número + nuits»: «Pour deux nuits».","(pour|nuit|deux|trois|une|quatre|cinq)","Pour deux nuits.","Para dos noches.","une nuit=una noche;deux nuits=dos noches"),
T9("Voici votre clé. La chambre est au troisième étage.","Aquí tiene su llave. La habitación está en la tercera planta.","Da las gracias: «Merci beaucoup».","(merci|d'accord|ok|parfait)","Merci beaucoup !","¡Muchas gracias!","la clé=la llave;le troisième étage=la tercera planta"),
T9("Vous avez besoin d'autre chose ?","¿Necesita algo más?","«Non, merci» o pide algo: «Oui, le wifi, s'il vous plaît». Cierra con «Bonne nuit».","(non|oui|merci|wifi|petit-dejeuner)","Non, merci. Bonne nuit !","No, gracias. ¡Buenas noches!","avoir besoin de=necesitar;autre chose=otra cosa;bonne nuit=buenas noches")
]},
{t:"En el restaurante",tag:"x",d:"Pedir mesa, comida, bebida, postre y la cuenta.",turns:[
T9("Bonsoir, une table pour combien de personnes ?","Buenas noches, ¿una mesa para cuántas personas?","«Une table pour + número + personnes»: «Une table pour deux personnes, s'il vous plaît».","(table|pour|deux|trois|quatre|une personne)","Une table pour deux personnes, s'il vous plaît.","Una mesa para dos personas, por favor.","une table=una mesa;une personne=una persona"),
T9("Voici le menu. Qu'est-ce que vous prenez comme plat ?","Aquí tiene la carta. ¿Qué toma de plato principal?","Pide con «Je voudrais…» o «Je prends…» y el plato.","(je prends|je voudrais|poulet|poisson|pates|salade|steak)","Je voudrais le poulet avec des frites, s'il vous plaît.","Quisiera el pollo con patatas fritas, por favor.","le poulet=el pollo;le poisson=el pescado;les pâtes=la pasta;la salade=la ensalada;les frites=las patatas fritas;le plat=el plato principal"),
T9("Et comme boisson ?","¿Y para beber?","Pide una bebida: «De l'eau», «Du vin», «De la bière», «Un jus d'orange».","(eau|vin|biere|jus|coca|boisson|un |une |du |de la )","De l'eau, s'il vous plaît.","Agua, por favor.","de l'eau=agua;du vin=vino;de la bière=cerveza;un jus=un zumo"),
T9("Vous prenez un dessert ?","¿Va a tomar postre?","«Oui, une glace» o «Non, merci». Puedes pedir: une glace (helado), une tarte (tarta), un gâteau.","(oui|non|dessert|glace|gateau|tarte|merci)","Oui, une glace à la vanille.","Sí, un helado de vainilla.","une glace=un helado;une tarte=una tarta;le dessert=el postre"),
T9("Tout s'est bien passé ?","¿Todo ha ido bien?","Responde «Oui, c'était délicieux» (estaba delicioso) y da las gracias.","(oui|delicieux|bon|merci|tres bien)","Oui, c'était délicieux, merci !","Sí, estaba delicioso, ¡gracias!","délicieux=delicioso;c'était=era / estaba"),
T9("Vous voulez l'addition ?","¿Quiere la cuenta?","Pídela: «Oui, l'addition, s'il vous plaît».","(addition|oui)","Oui, l'addition, s'il vous plaît.","Sí, la cuenta, por favor.","l'addition=la cuenta")
]},
{t:"Hacer un plan con un amigo",tag:"x",d:"Hablar tuteando: planes del fin de semana y quedar.",turns:[
T9("Salut ! Tu fais quoi ce week-end ?","¡Hola! ¿Qué haces este fin de semana?","Con amigos se usa «tu» (informal). Responde con tu plan: «Je vais + lugar» (voy a…): «Je vais au cinéma». O «Je travaille», «Je reste à la maison».","(je vais|je travaille|je fais|je ne fais|j'etudie|je reste|j'ai)","Je vais au cinéma avec des amis.","Voy al cine con unos amigos.","ce week-end=este fin de semana;je vais au cinéma=voy al cine;je reste à la maison=me quedo en casa"),
T9("D'accord ! Moi, je vais voir un film avec des amis. Tu veux venir avec nous ?","¡Vale! Yo voy a ver una película con unos amigos. ¿Quieres venir con nosotros?","Acepta con «Oui, avec plaisir !» o rechaza con «Désolé, je ne peux pas».","(oui|non|avec plaisir|desole|je ne peux|bonne idee|d'accord)","Oui, avec plaisir !","¡Sí, con mucho gusto!","avec plaisir=con gusto;je ne peux pas=no puedo;désolé=lo siento;bonne idée=buena idea;voir un film=ver una película"),

T9("Parfait ! Je t'envoie l'adresse. À samedi !","¡Perfecto! Te mando la dirección. ¡Hasta el sábado!","Confirma y despídete: «D'accord, à samedi !».","(a samedi|a bientot|d'accord|ok|merci|au revoir)","D'accord, à samedi !","Vale, ¡hasta el sábado!","je t'envoie l'adresse=te mando la dirección;à samedi=hasta el sábado")
]},
{t:"En la universidad",tag:"x",d:"Hablar de estudios, idiomas y horarios con un compañero.",turns:[
T9("Bonjour ! Comment vous appelez-vous ?","¡Hola! ¿Cómo se llama?","«Je m'appelle + nombre». Puedes añadir que eres nuevo/a: «Je suis nouveau / nouvelle».","(je m'appelle|oui|je suis|moi c'est)","Oui, je suis nouveau. Je m'appelle Marc.","Sí, soy nuevo. Me llamo Marc.","nouveau / nouvelle=nuevo / nueva"),
T9("Qu'est-ce que vous étudiez ?","¿Qué estudia?","«J'étudie + materia»: la gestion, le droit, l'économie…","(j'etudie|je fais|etudiant)","J'étudie la gestion d'entreprise.","Estudio gestión de empresas.","j'étudie=estudio;la gestion=la gestión;le droit=el derecho;l'économie=la economía"),
T9("Vous parlez quelles langues ?","¿Qué idiomas habla?","«Je parle + idiomas»: español, catalán, inglés… Une con «et» (y).","(je parle|espagnol|anglais|catalan|francais)","Je parle espagnol, catalan et anglais.","Hablo español, catalán e inglés.","l'espagnol=el español;le catalan=el catalán;l'anglais=el inglés;le français=el francés"),
T9("Vous avez cours de français quel jour ?","¿Qué día tiene clase de francés?","«J'ai cours le + día»: le mardi (los martes), le mercredi (los miércoles)…","(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)","J'ai cours le mardi et le mercredi.","Tengo clase los martes y los miércoles.","lundi=lunes;mardi=martes;mercredi=miércoles;jeudi=jueves;vendredi=viernes;samedi=sábado;dimanche=domingo"),
T9("Le français, c'est difficile ?","¿El francés es difícil?","Opina: «Oui, c'est un peu difficile» o «Non, c'est facile».","(oui|non|difficile|facile|un peu|pas)","Un peu difficile, mais j'aime bien !","Un poco difícil, ¡pero me gusta!","difficile=difícil;facile=fácil;un peu=un poco")
]},
{t:"Hobbies y comida",tag:"x",d:"Contar qué te gusta hacer, comer y escuchar.",turns:[

function convMenu(){const v=$('#view');window.WANT=null;

function convStopMic(){const t=ENG.tg;if(t){ENG.tg=null;clearTimeout(t.st);clearTimeout(t.to)}}
function convShow(){const v=$('#view'),c=CONV[cv.sc],t=c.turns[cv.i];if(!t){convEnd();return}
const sc0=cv,i0=cv.i,alive=()=>tab==='talk'&&cv===sc0&&cv.i===i0;window.WANT=[t.ex];ENG.alts=[];
v.innerHTML=`<div class="row" style="align-items:center"><button class="ghost" id="back">← Conversaciones</button><span class="mut">${esc(c.t)} · ${cv.i+1}/${c.turns.length}</span></div>
<div class="bub bot"><b style="font-size:18px">${esc(t.q)}</b><div class="row"><button class="w" id="qs">🔊</button><button class="w" id="ql">🐢 Lento</button></div></div>
<div class="card"><div>🇪🇸 <b>Dice:</b> ${esc(t.es)}</div><div style="margin-top:6px">💡 <b>Cómo contestar:</b> ${esc(t.how)}</div>${t.v.length?`<div class="mut" style="margin-top:8px">${c.tag==='x'?'Vocabulario nuevo':'Vocabulario útil'} (toca para oírlo):</div><div>${t.v.map(([f,e],k)=>`<button class="w" data-vw="${k}">${esc(f)} <span class="mut">= ${esc(e)}</span></button>`).join('')}</div>`:''}</div>

const inp=$('#ans');let done=false,on=false;const lab=s=>{const m=$('#mic');if(m)m.textContent=s};
$('#back').onclick=()=>{convStopMic();cv=null;talk()};
$('#qs').onclick=()=>say(t.q);$('#ql').onclick=()=>say(t.q,.55);
v.querySelectorAll('[data-vw]').forEach(b=>b.onclick=()=>say(t.v[+b.dataset.vw][0]));
$('#hint').onclick=()=>{if(!done)$('#fb').innerHTML=`<div class="card" style="margin:6px 0">Ejemplo: <b>${esc(t.ex)}</b><br><span class="mut">${esc(t.exes)}</span></div>`};
const check=()=>{if(done){cv.i++;convShow();return}const val=inp.value.trim();if(!val)return;done=true;convStopMic();
const ok=t.re.test(norm(val));rec('conv',ok);if(ok)cv.ok++;else cv.miss.push(t);
$('#fb').innerHTML=`<p class="${ok?'ok':'ko'}"><b>${ok?'✓ Muy bien':'✗ Casi: tu respuesta no encaja con lo que te preguntan'}</b></p><div class="card" style="margin:6px 0">Ejemplo: <b>${esc(t.ex)}</b> <button class="w" id="es">🔊</button><br><span class="mut">${esc(t.exes)}</span></div>`;
$('#chk').textContent='Siguiente ▶';const e=$('#es');if(e)e.onclick=()=>say(t.ex)};
$('#chk').onclick=check;inp.onkeydown=e=>{if(e.key==='Enter')check()};
$('#mic').onclick=()=>{if(done)return;if(on){stopListen();return}on=true;lab('⏹ Parar');$('#fb').innerHTML='<p class="mut">Habla ahora. Revisa el texto y pulsa Responder.</p>';
listen(tx=>{on=false;lab('🎤 Decirlo');if(!done&&alive())$('#fb').innerHTML=tx?'<p class="mut">Revisa el texto (puedes corregirlo) y pulsa Responder.</p>'+chips():'<p class="ko">No he oído nada. Inténtalo otra vez.</p>'},m=>{on=false;lab('🎤 Decirlo');if(!done&&alive())$('#fb').innerHTML=`<p class="ko">${m}</p>`})};
say(t.q);inp.focus()}
function convEnd(){const c=CONV[cv.sc],n=c.turns.length,v=$('#view');window.WANT=null;const sc=cv.sc;
v.innerHTML=`<div class="card"><h2>${cv.ok===n?'🎉 ':''}Conversación terminada: ${cv.ok}/${n}</h2>${cv.miss.length?`<p class="ko"><b>A repasar:</b></p><ul>${cv.miss.map(t=>`<li>${esc(t.q)} → <b>${esc(t.ex)}</b><br><span class="mut">${esc(t.exes)}</span></li>`).join('')}</ul>`:'<p class="ok">¡Todo bien!</p>'}<div class="row"><button class="pri" id="again">Repetir</button><button id="menu">Otra conversación</button></div></div>`;
$('#again').onclick=()=>convStart(sc);$('#menu').onclick=()=>{cv=null;talk()}}
function talk(){window.WANT=null;if(!cv)convMenu();else convShow()}

async function micMeter(out){out.textContent='Pidiendo micrófono…';let st;
try{st=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){out.innerHTML='✗ No se puede capturar audio: <b>'+esc(e.name||'error')+'</b>. Es un bloqueo de permisos del navegador o de la página que contiene la app.';lg('captura de audio: '+(e.name||'error'));return}
lg('captura de audio: permiso concedido');
const AC=window.AudioContext||window.webkitAudioContext;let ac,an,buf;try{ac=new AC();const src=ac.createMediaStreamSource(st);an=ac.createAnalyser();an.fftSize=512;src.connect(an);buf=new Uint8Array(an.fftSize)}catch(e){st.getTracks().forEach(t=>t.stop());out.textContent='✓ Se abre el micrófono, pero no puedo medir el nivel en este navegador.';return}
let max=0;const t0=Date.now();
const tick=()=>{an.getByteTimeDomainData(buf);let m=0;for(const x of buf)m=Math.max(m,Math.abs(x-128));max=Math.max(max,m);out.textContent='Habla ahora… '+'█'.repeat(Math.min(30,Math.round(m/3)));
if(Date.now()-t0<4000)requestAnimationFrame(tick);else{st.getTracks().forEach(t=>t.stop());try{ac.close()}catch(e){}
out.textContent=max>10?'✓ El micrófono capta tu voz (nivel '+max+'). Si aun así el reconocimiento falla, el problema es del servicio de voz del navegador, no del micrófono.':'✗ El micrófono está abierto pero casi no capta sonido (nivel '+max+'). Revisa qué micrófono usa el navegador y el volumen del sistema.';lg('nivel de audio: '+max)}};tick()}
