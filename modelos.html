<!DOCTYPE html>
<html lang="es" style="--sub:#0b2540"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modelos de examen · Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Modelos de examen: una portada con las asignaturas y, al abrir un modelo, el examen como una hoja de PDF con una cuenta atrás de 2 h. */
:root{--bg:#f6f8fb;--fg:#1f2d3d;--mut:#64748b;--card:#fff;--bd:#e3e8ef;--ink:#0b2540;--gold:#f7a833;--ok:#15803d;--ko:#dc2626;
  --c-com:#4f46e5;--c-bus:#10a37f;--c-fra:#e5484d;--c-mat:#b45309;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1080px;margin:0 auto;padding:16px 16px 60px}
main>h1{font:800 clamp(24px,4.6vw,34px)/1.15 Montserrat,system-ui,sans-serif;color:var(--ink);margin:22px 0 6px}
.mut{color:var(--mut);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:16px}
.subj{background:#fff;border:1px solid var(--bd);border-top:6px solid var(--c);border-radius:16px;padding:16px 18px;box-shadow:0 1px 2px rgba(11,37,64,.04)}
.subj h2{font:800 18px Montserrat,system-ui,sans-serif;color:var(--ink);margin:0 0 4px}
.subj .when{font-weight:700;color:var(--c);font-size:14px}
.subj ul{margin:8px 0 12px;padding-left:18px;font-size:14px;color:var(--fg)}
.subj .mods{display:flex;flex-wrap:wrap;gap:6px}
.subj .mods button{font:700 13.5px Montserrat,system-ui,sans-serif;border:1px solid var(--bd);background:#fff;color:var(--ink);border-radius:99px;padding:7px 13px;cursor:pointer}
.subj .mods button:hover{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#fff)}
.subj .mods button.done::after{content:" ✓";color:var(--ok)}
.est{display:inline-block;font-size:12px;font-weight:700;color:#92400e;background:#fef3c7;border-radius:99px;padding:2px 9px;margin-top:4px}
/* barra del examen */
.xbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.xbar .in{max-width:1080px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.xbar .ttl{font:800 15px Montserrat,system-ui,sans-serif;color:var(--ink);margin-right:auto;min-width:0}
.clock{font:800 22px/1 Montserrat,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);background:#eef2f7;border-radius:12px;padding:8px 12px;letter-spacing:.5px}
.clock.warn{background:#fef3c7;color:#92400e}.clock.crit{background:#fee2e2;color:#b91c1c}.clock.end{background:#dcfce7;color:var(--ok)}
.xbar button{font:700 13.5px Montserrat,system-ui,sans-serif;border:1px solid var(--bd);background:#fff;color:var(--ink);border-radius:99px;padding:8px 13px;cursor:pointer}
.xbar button.pri{background:var(--gold);border-color:var(--gold)}
/* hoja tipo PDF */
.desk{background:#525659;padding:28px 12px 60px;min-height:calc(100dvh - 120px)}
.sheet{background:#fff;max-width:820px;margin:0 auto 24px;padding:56px 64px;box-shadow:0 4px 24px rgba(0,0,0,.35);color:#111;font:15.5px/1.6 Cambria,"Times New Roman",Georgia,serif}
@media (max-width:640px){.sheet{padding:28px 20px}}
.sheet .hd{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #111;padding-bottom:8px;margin-bottom:14px;font-size:13px}
.sheet .hd b{font-size:14px}
.sheet h1{font:700 22px/1.25 Cambria,"Times New Roman",serif;text-align:center;margin:6px 0 2px}
.sheet .sub{text-align:center;margin:0 0 14px;font-size:14px}
.sheet .id{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 14px;font-size:14px}
.sheet .id span{flex:1;min-width:200px;border-bottom:1px dotted #555;padding-bottom:2px}
.sheet .ins{border:1px solid #111;padding:10px 14px;margin:10px 0 18px;font-size:14px}
.sheet .ins p{margin:4px 0}
.sheet table{border-collapse:collapse;width:100%;margin:8px 0 14px;font-size:14px}
.sheet th,.sheet td{border:1px solid #444;padding:5px 8px;text-align:left;vertical-align:top}
.sheet th{background:#f1f1f1}
.sheet h2{font:700 16.5px Cambria,"Times New Roman",serif;margin:22px 0 6px;border-bottom:1px solid #999;padding-bottom:3px}
.q{margin:14px 0 6px;break-inside:avoid}
.q .qh{font-weight:700}
.q .pts{float:right;font-weight:400;font-style:italic;font-size:13.5px}
.q ol.opt{list-style:upper-alpha;margin:6px 0 4px 6px;padding-left:22px}
.q ol.opt li{margin:2px 0}
.q .ctx{border-left:3px solid #999;padding:4px 12px;margin:8px 0;background:#fafafa;font-size:14.5px}
.lines{margin:6px 0 4px}
.lines i{display:block;border-bottom:1px dotted #777;height:26px}
.listen{display:inline-flex;align-items:center;gap:6px;font:700 13px "Open Sans",sans-serif;border:1px solid #444;background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;margin:4px 0}
.sol{display:none;margin:8px 0 4px;padding:9px 13px;border-left:4px solid var(--ok);background:#f0fdf4;font:14.5px/1.55 "Open Sans",system-ui,sans-serif;color:#14532d}
.sol b:first-child{display:block;margin-bottom:2px}
.showsol .sol{display:block}
.endmsg{display:none;max-width:820px;margin:0 auto 18px;background:#dcfce7;border:1px solid #86efac;color:#14532d;border-radius:12px;padding:12px 16px;font-weight:600}
.showsol .endmsg{display:block}
@media print{header.top,.xbar,.endmsg{display:none!important}.desk{background:#fff;padding:0}.sheet{box-shadow:none;margin:0;max-width:none;padding:0 6mm}body{background:#fff}}
</style>
<link rel="stylesheet" href="claro.css">
</head><body>
<header class="top"><div class="in"><a class="brand" href="index.html"><i>🎓</i><span>Estudio</span></a><div class="tabs"><a href="asignaturas.html">Asignaturas</a><a href="agenda.html">Calendario</a><a href="notas.html">Notas</a><a class="on" href="modelos.html">Exámenes</a><a href="horario.html">Horario</a><a href="actualizar.html">Temario nuevo</a></div></div></header>
<div id="app"></div>
<script src="examen-business.js"></script>
<script src="examen-communication.js"></script>
<script src="examen-francais.js"></script>
<script src="examen-mates.js"></script>
<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const EX=window.EXAMENES||{};
const ORDEN=['communication','business','francais','mates'];
const DUR=2*60*60*1000;
let tick=null,cur=null;

function home(){clearInterval(tick);cur=null;try{speechSynthesis.cancel()}catch(e){}
  const done=LS.get('ex-done',{});
  $('#app').innerHTML=`<main><h1>📝 Modelos de examen</h1>
  <p class="mut">Cinco modelos por asignatura, hechos con el formato real de cada examen según AulaESCI. Al abrir un modelo empieza una cuenta atrás de 2 horas. Responde en papel; al acabar el tiempo, o si pulsas «Ver soluciones», aparece la solución de cada pregunta.</p>
  <div class="grid">${ORDEN.filter(k=>EX[k]).map(k=>{const e=EX[k];return `<section class="subj" style="--c:${e.color}">
    <h2>${e.emoji} ${e.nombre}</h2><div class="when">${e.fecha}</div>
    <ul>${e.formato.map(f=>`<li>${f}</li>`).join('')}</ul>${e.estimado?`<span class="est">${e.estimado}</span>`:''}
    <div class="mods" style="margin-top:10px">${e.modelos.map((m,i)=>`<button data-k="${k}" data-i="${i}" class="${done[k+i]?'done':''}">Modelo ${i+1}</button>`).join('')}</div></section>`}).join('')}</div></main>`;
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>open(b.dataset.k,+b.dataset.i));scrollTo(0,0)}

function fmt(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return `${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`}
function lines(n){return `<div class="lines">${'<i></i>'.repeat(n||4)}</div>`}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';u.rate=.9;const v=speechSynthesis.getVoices().find(v=>/^fr/i.test(v.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){alert('Este navegador no puede leer el audio en voz alta.')}}

function qHTML(q,n){
  let h=`<div class="q"><div class="qh">${q.n||('Question '+n)}${q.p!=null?`<span class="pts">(${q.p} ${q.p==1?'point':'points'})</span>`:''}</div>`;
  if(q.ctx)h+=`<div class="ctx">${q.ctx}</div>`;
  if(q.audio)h+=`<button class="listen" data-audio="${encodeURIComponent(q.audio)}">🔊 Écouter l’enregistrement</button> <span style="font-size:13px;color:#555">(deux écoutes)</span>`;
  h+=`<div>${q.q}</div>`;
  if(q.o)h+=`<ol class="opt">${q.o.map(o=>`<li>${o}</li>`).join('')}</ol>`;
  if(q.l)h+=lines(q.l);
  if(q.s!=null||q.a!=null)h+=`<div class="sol"><b>Solución</b>${q.a!=null?`<b>${'ABCD'[q.a]}</b> `:''}${q.s||''}</div>`;
  return h+'</div>'}

function open(k,i){const e=EX[k],m=e.modelos[i];cur={k,i};
  const key='ex-start-'+k+i;let st=LS.get(key,null);if(!st||Date.now()-st>DUR+60*60*1000){st=Date.now();LS.set(key,st)}
  const body=m.secciones.map(s=>`${s.h?`<h2>${s.h}</h2>`:''}${s.intro?`<p>${s.intro}</p>`:''}${s.qs.map((q,j)=>qHTML(q,j+1)).join('')}`).join('');
  $('#app').innerHTML=`<div class="xbar"><div class="in"><button id="back">← Modelos</button><span class="ttl">${e.emoji} ${e.nombre} · Modelo ${i+1}</span>
    <span class="clock" id="clock">2:00:00</span><button id="sol" class="pri">Ver soluciones</button><button id="pr">Imprimir / PDF</button><button id="rs" title="Volver a empezar el reloj">↺</button></div></div>
  <div class="desk" id="desk"><div class="endmsg" id="endmsg">⏰ Se ha acabado el tiempo. Debajo de cada pregunta tienes la solución.</div>
  <article class="sheet"><div class="hd"><span><b>ESCI-UPF</b><br>${e.grado}</span><span style="text-align:right">${e.curso}<br>${e.fecha}</span></div>
  <h1>${e.titulo}</h1><p class="sub">${e.lang==='fr'?'Modèle d’examen':'Exam model'} ${i+1}${m.tema?' · '+m.tema:''} · ${e.lang==='fr'?'Durée : 2 heures':'Duration: 2 hours'}</p>
  <div class="id"><span>${e.lang==='fr'?'Nom et prénom':e.lang==='es'?'Nombre y apellidos':'Name and surname'}:</span><span>${e.lang==='fr'?'Groupe':'Group'}: 3</span></div>
  <div class="ins">${e.instrucciones.map(x=>`<p>${x}</p>`).join('')}</div>${body}
  <p style="text-align:center;margin-top:28px;font-style:italic">${e.lang==='fr'?'Bon courage !':'End of the exam. Good luck!'}</p></article></div>`;
  $('#back').onclick=home;$('#pr').onclick=()=>print();
  $('#sol').onclick=()=>{const d=$('#desk');d.classList.toggle('showsol');$('#sol').textContent=d.classList.contains('showsol')?'Ocultar soluciones':'Ver soluciones'};
  $('#rs').onclick=()=>{if(!confirm('¿Volver a empezar la cuenta atrás de 2 horas?'))return;LS.set(key,Date.now());$('#desk').classList.remove('showsol');$('#sol').textContent='Ver soluciones';run(key)};
  document.querySelectorAll('[data-audio]').forEach(b=>b.onclick=()=>say(decodeURIComponent(b.dataset.audio)));
  run(key);scrollTo(0,0)}

function run(key){clearInterval(tick);const c=$('#clock');
  const step=()=>{if(!cur)return clearInterval(tick);const left=DUR-(Date.now()-LS.get(key,Date.now()));c.textContent=fmt(left);
    c.className='clock'+(left<=0?' end':left<5*60e3?' crit':left<15*60e3?' warn':'');
    if(left<=0){clearInterval(tick);c.textContent='0:00:00';$('#desk').classList.add('showsol');$('#sol').textContent='Ocultar soluciones';const d=LS.get('ex-done',{});d[cur.k+cur.i]=1;LS.set('ex-done',d)}};
  step();tick=setInterval(step,1000)}
home();
</script>
</body></html>
