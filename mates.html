<!DOCTYPE html>
<html lang="en" style="--sub:#b45309"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mathematics · Estudio</title>
<style>
/* Mathematics: exercises only, in English. One exercise at a time; a right answer moves on, a wrong one opens the worked solution. */
:root{--bg:#f6f8fb;--fg:#1f2d3d;--mut:#64748b;--card:#fff;--bd:#e3e8ef;--ac:#b45309;--acs:#fdf3e3;--ok:#15803d;--oks:rgba(21,128,61,.1);--ko:#dc2626;--kos:rgba(220,38,38,.08);--ink:#0b2540;--gold:#f7a833}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 60px}
main>h1{font:800 clamp(24px,4.6vw,34px)/1.15 Montserrat,system-ui,sans-serif;color:var(--ink);margin:22px 0 6px}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 1px 2px rgba(11,37,64,.04)}
h2{font:800 18px Montserrat,system-ui,sans-serif;color:var(--ink);margin:0 0 10px}
.modes{display:grid;gap:10px}
.mode{display:grid;gap:2px;text-align:left;font:inherit;border:1px solid var(--bd);border-top:5px solid var(--ac);background:#fff;border-radius:14px;padding:14px 16px;cursor:pointer;color:var(--fg)}
.mode:hover{border-color:var(--ac)}
.mode b{font:800 17px Montserrat,system-ui,sans-serif;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{font:600 13.5px "Open Sans",sans-serif;border:1px solid var(--bd);background:#fff;color:var(--ink);border-radius:99px;padding:6px 12px;cursor:pointer}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--acs);color:var(--ac)}
.tag.src{background:#eef2f7;color:var(--mut);font-weight:600}
.q{font-size:17px;line-height:1.6;color:var(--ink);margin:6px 0 14px}
.q sup,.q sub,.sol sup,.sol sub,.opt sup,.opt sub{font-size:.72em}
.ansrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ansrow input{font:inherit;font-size:17px;padding:10px 14px;border-radius:12px;border:1px solid var(--bd);background:#fff;color:var(--fg);width:min(260px,100%)}
.ansrow input:focus{outline:2px solid var(--gold);outline-offset:1px}
.unit{color:var(--mut);font-weight:600}
button.pri{font:800 14.5px Montserrat,system-ui,sans-serif;border:0;background:var(--gold);color:var(--ink);border-radius:99px;padding:11px 22px;cursor:pointer}
button.sec{font:700 14px Montserrat,system-ui,sans-serif;border:1px solid var(--bd);background:#fff;color:var(--ink);border-radius:99px;padding:10px 18px;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:7px 0;padding:11px 14px;font:inherit;border:1px solid var(--bd);background:#fff;color:var(--fg);border-radius:12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt .l{font-weight:800;color:var(--ac);min-width:18px}
.opt.good{border-color:var(--ok);background:var(--oks);opacity:1}.opt.bad{border-color:var(--ko);background:var(--kos);opacity:1}
.fb{margin-top:14px;padding:12px 14px;border-radius:12px;border:1px solid var(--bd)}
.fb.good{border-color:var(--ok);background:var(--oks);color:var(--ok);font-weight:700}
.fb.bad{border-color:var(--ko);background:var(--kos)}
.fb.bad>b{color:var(--ko)}
details.sol{margin-top:10px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
details.sol summary{cursor:pointer;font-weight:700;color:var(--ink)}
details.sol div{margin-top:8px;line-height:1.75}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 0}
.score{font-weight:700;color:var(--ink)}
.hint{font-size:13px;color:var(--mut);margin-top:8px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="claro.css">
</head><body>
<header class="top"><div class="in"><a class="brand" href="index.html"><i>🎓</i><span>Estudio</span></a><div class="tabs"><a class="on" href="asignaturas.html">Asignaturas</a><a href="agenda.html">Calendario</a><a href="notas.html">Notas</a><a href="actualizar.html">Temario nuevo</a></div></div></header>
<main>
<h1>📐 Mathematics</h1>
<p class="mut">Exercises only. They are modelled on the Problem Sets, midterms and practice tests from AulaESCI, with new numbers every time.</p>
<div id="view"></div>
</main>
<script src="mates-ejercicios.js"></script>
<script>
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const MODES={m1:{t:'Midterm 1',d:'Lectures 1–6 · percentages, sequences, interest, EAR and mortgages',f:l=>l<=6},
             m2:{t:'Midterm 2',d:'Lectures 7–16 · functions, logarithms, derivatives and optimisation',f:l=>l>=7&&l<=16},
             all:{t:'Everything',d:'All lectures (1–18), including functions of two variables',f:()=>true}};
let P=LS.get('ma-prog',{});                    /* {m1:{ok,n}, m2:{ok,n}, all:{ok,n}} — also read by the Asignaturas page */
let S=null;                                    /* current session: {mode, lec, deck, q, ok, n, wrong} */

function menu(){S=null;
  $('#view').innerHTML=`<div class="card"><h2>Choose what to practise</h2><div class="modes">${Object.entries(MODES).map(([k,m])=>{const n=MATES.G.filter(g=>m.f(g.lec)).length,p=P[k];
    return `<button class="mode" data-m="${k}"><b>${m.t}</b><span class="mut">${m.d}</span><span class="mut">${n} exercise types, new numbers each time${p&&p.n?` · ${p.n} answered, ${Math.round(100*p.ok/p.n)}% correct`:''}</span></button>`}).join('')}</div></div>`;
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>start(b.dataset.m,null))}

/* a shuffled deck of every exercise type in the group: all of them come up before any repeats, and each time with new numbers */
function deck(mode,lec){return shuf(MATES.G.filter(g=>MODES[mode].f(g.lec)&&(lec==null||g.lec===lec)))}
function start(mode,lec){S={mode,lec,deck:deck(mode,lec),ok:0,n:0,last:null};next()}
function next(){if(!S.deck.length){S.deck=deck(S.mode,S.lec);if(S.deck.length>1&&S.deck[0]===S.last)S.deck.push(S.deck.shift())}
  let q=null;while(!q&&S.deck.length){const g=S.deck.shift();q=MATES.make(g);if(q)S.last=g}
  if(!q)return menu();S.q=q;show()}

function parse(s){s=String(s).trim().replace(/[€$%\s]/g,'').replace(/−/g,'-');if(!s)return NaN;
  if(s.includes(',')&&s.includes('.'))s=s.lastIndexOf(',')>s.lastIndexOf('.')?s.replace(/\./g,'').replace(',','.'):s.replace(/,/g,'');
  else if(/^-?\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,'');else s=s.replace(',','.');
  if(/^-?\d+\/\d+$/.test(s)){const[a,b]=s.split('/');return a/b}
  return /^-?(\d+\.?\d*|\.\d+)$/.test(s)?parseFloat(s):NaN}
const right=(q,v)=>Math.abs(v-q.ans)<=Math.max(0.5*Math.pow(10,-q.d)*1.02+1e-9,Math.abs(q.ans)*0.0005);   /* small margin for rounding in intermediate steps */
const fmt=(x,d)=>(Math.round(x*10**d)/10**d).toLocaleString('en-US',{maximumFractionDigits:d});

function show(){const q=S.q,m=MODES[S.mode],lecs=[...new Set(MATES.G.filter(g=>m.f(g.lec)).map(g=>g.lec))].sort((a,b)=>a-b);
  $('#view').innerHTML=`<div class="chips"><button data-l="" class="${S.lec==null?'on':''}">${m.t}: all</button>${lecs.map(l=>`<button data-l="${l}" class="${S.lec===l?'on':''}" title="${MATES.NAMES[l]}">L${l}</button>`).join('')}</div>
  <div class="card"><div class="tags"><span class="tag">Lecture ${q.lec} · ${MATES.NAMES[q.lec]}</span><span class="tag src">Based on ${q.src}</span></div>
  <div class="q">${q.q}</div>
  ${q.type==='mc'?q.opts.map((o,i)=>`<button class="opt" data-o="${i}"><span class="l">${'ABCD'[i]}</span><span>${o}</span></button>`).join('')
   :`<div class="ansrow"><input id="ans" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your answer" aria-label="Your answer">${q.unit?`<span class="unit">${q.unit}</span>`:''}<button class="pri" id="chk">Check</button></div>
     <p class="hint">${q.d===0?'Give a whole number.':`Round to ${q.d} decimal${q.d>1?'s':''}.`} A comma or a dot both work.</p>`}
  <div id="fb"></div>
  <div class="bar"><span class="score">${S.n?`${S.ok} correct out of ${S.n}`:'Session started'}</span><span><button class="sec" id="skip">Skip</button> <button class="sec" id="end">Finish</button></span></div></div>`;
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(S.mode,b.dataset.l===''?null:+b.dataset.l));
  $('#end').onclick=finish;$('#skip').onclick=()=>grade(false,null,true);
  if(q.type==='mc')document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>grade(+b.dataset.o===q.a,+b.dataset.o));
  else{const i=$('#ans');i.focus();const go=()=>{if(!i.value.trim()){$('#fb').innerHTML='<p class="hint">Type your answer first, for example 12.5 or −3.</p>';i.focus();return}
      const v=parse(i.value);grade(!isNaN(v)&&right(q,v),v,false,isNaN(v))};   /* something that is not a number counts as a wrong answer, so the solution is always shown */
    $('#chk').onclick=go;i.onkeydown=e=>{if(e.key==='Enter')go()}}}

function grade(ok,given,skipped,notNum){const q=S.q;if(S.done)return;S.done=true;
  S.n++;if(ok)S.ok++;const p=P[S.mode]=P[S.mode]||{ok:0,n:0};p.n++;if(ok)p.ok++;LS.set('ma-prog',P);
  document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('good');else if(i===given)b.classList.add('bad')});
  const a=$('#ans');if(a)a.readOnly=true;const c=$('#chk');if(c)c.disabled=true;$('#skip').disabled=true;
  const corr=q.type==='mc'?`${'ABCD'[q.a]}) ${q.opts[q.a]}`:`${fmt(q.ans,q.d)}${q.unit?' '+q.unit:''}`;
  if(ok){$('#fb').innerHTML='<div class="fb good">✓ Correct</div>';setTimeout(()=>{S.done=false;next()},850);return}
  /* wrong (or skipped): the worked solution opens and the student moves on when ready */
  $('#fb').innerHTML=`<div class="fb bad" id="wrong"><b>${skipped?'Skipped.':'✗ Not quite.'}</b>${notNum?' Your answer was not a number.':''} The correct answer is <b>${corr}</b>.
    <details class="sol" open><summary>How to solve it</summary><div class="sol">${q.sol}</div></details>
    <p style="margin:12px 0 0"><button class="pri" id="nx" disabled>Next exercise →</button></p></div>`;
  /* The answer must stay on screen until the student decides to move on: the button is not focused (a held Enter key used to press it at once)
     and it only becomes active after a moment. The feedback is scrolled into view because on a phone it can open below the keyboard. */
  if(a)a.blur();
  $('#nx').onclick=()=>{S.done=false;next();scrollTo(0,0)};
  setTimeout(()=>{const b=$('#nx');if(b)b.disabled=false},900);
  try{$('#wrong').scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}

function finish(){const s=S;$('#view').innerHTML=`<div class="card"><h2>Session finished</h2><p>${s.n?`You answered <b>${s.n}</b> exercise${s.n>1?'s':''} and got <b>${s.ok}</b> right (${Math.round(100*s.ok/s.n)}%).`:'You did not answer any exercise.'}</p>
  <p><button class="pri" id="again">Practise again</button> <button class="sec" id="back">Change group</button></p></div>`;
  $('#again').onclick=()=>start(s.mode,s.lec);$('#back').onclick=menu}
menu();
</script>
</body></html>
