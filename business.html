<style>
:root{--bg:#f7f7f4;--fg:#1c1c1a;--mut:#6b6b66;--card:#fff;--bd:#e2e0d8;--ac:#2f5bd8;--acs:rgba(47,91,216,.09);--ok:#1d8a4b;--oks:rgba(29,138,75,.1);--ko:#c0392b;--kos:rgba(192,57,43,.1);--tr:#9a6a00;--trs:rgba(242,194,0,.14);--fx:#f1f3fb;box-sizing:border-box;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--fg:#ececea;--mut:#9a9a94;--card:#1f2024;--bd:#33343a;--ac:#7c9cff;--acs:rgba(124,156,255,.12);--ok:#4cc27f;--oks:rgba(76,194,127,.12);--ko:#ff7b6b;--kos:rgba(255,123,107,.12);--tr:#f2c94c;--trs:rgba(242,201,76,.1);--fx:#262935;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16171a;--fg:#ececea;--mut:#9a9a94;--card:#1f2024;--bd:#33343a;--ac:#7c9cff;--acs:rgba(124,156,255,.12);--ok:#4cc27f;--oks:rgba(76,194,127,.12);--ko:#ff7b6b;--kos:rgba(255,123,107,.12);--tr:#f2c94c;--trs:rgba(242,201,76,.1);--fx:#262935;color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:19px;margin:6px 0 10px}h3{font-size:16px;margin:0 0 8px;color:var(--ac)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:10px;cursor:pointer}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
button:disabled{opacity:.55;cursor:default}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}.chips button{padding:6px 11px;font-size:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:10px 0;overflow-x:auto}
.mut{color:var(--mut);font-size:14px}.ok{color:var(--ok)}.ko{color:var(--ko)}
ul.k{margin:0;padding-left:18px}ul.k li{margin:3px 0}
.fx{background:var(--fx);border-left:4px solid var(--ac);border-radius:6px;padding:6px 10px;margin:8px 0;font-family:"Cambria Math","Times New Roman",serif;font-size:17px}
.ej{font-size:14.5px;margin:8px 0 0;padding:6px 10px;border-radius:6px;background:var(--acs)}
.tr{font-size:14.5px;margin:8px 0 0;padding:6px 10px;border-radius:6px;background:var(--trs);border-left:4px solid var(--tr)}
.topic-h{margin:2px 0 4px}.topic-sub{margin:0 0 8px}
.toc{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px}.toc a{color:var(--ac);text-decoration:none}
table{border-collapse:collapse;width:100%;font-size:14.5px}td,th{border:1px solid var(--bd);padding:5px 8px;text-align:left;vertical-align:top}th{background:var(--acs)}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:6px 0;padding:10px 12px}
.opt .l{font-weight:800;color:var(--ac);min-width:18px}
.opt.good{border-color:var(--ok);background:var(--oks)}.opt.bad{border-color:var(--ko);background:var(--kos)}
textarea{font:inherit;width:100%;box-sizing:border-box;min-height:110px;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--fg);margin:8px 0;resize:vertical}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--bd)}
.fb.good{border-color:var(--ok);background:var(--oks)}.fb.bad{border-color:var(--ko);background:var(--kos)}.fb.mid{border-color:var(--tr);background:var(--trs)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:600}
.bar{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--ac)}
label.r{display:inline-flex;gap:6px;align-items:center;margin-right:12px;font-size:15px}
.home{display:inline-block;margin:2px 0 6px;color:var(--ac);text-decoration:none;font-size:14.5px;font-weight:600}.home:hover{text-decoration:underline}</style></head><body><main>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%²]+/g,' ').trim();
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let P=LS.get('bo-prog',{});
function rec(t,ok){const x=P[t]=P[t]||{ok:0,n:0};x.n++;if(ok)x.ok++;LS.set('bo-prog',P)}

/* ================= TEMARIO (esquemático) =================
 s: {h: título, k: [[concepto, explicación]], f: [fórmulas], ej: ejemplo, tr: trampa de examen} */
const T=[
{n:'T1',t:'Economists’ view of behaviour',d:'Elección, riesgo y comportamiento',s:[
{h:'Rational choice',k:[['Racional','= coherente con preferencias, creencias y restricciones. NO = egoísta ni info perfecta'],['Preferences / utility','qué prefiere'],['Beliefs','qué cree que pasará (probabilidades)'],['Choice rule','cómo convierte preferencias + creencias en decisión']],ej:'Elegir un trabajo peor pagado por estabilidad → racional si valora la estabilidad.',tr:'Rationality ≠ maximizar dinero ≠ selfish.'},
{h:'4 axiomas de preferencias',k:[['Completeness','puedo comparar A y B (A, B o indiferente)'],['Transitivity','A≻B y B≻C ⇒ A≻C'],['Continuity','cambios pequeños → sin saltos bruscos de preferencia'],['Monotonicity','más de un bien deseable es mejor (ceteris paribus)']],ej:'A≻B, B≻C pero luego C≻A sin cambios → viola transitivity.',tr:'Completeness = poder comparar · Transitivity = no contradecirse.'},
{h:'Restricciones: choice set y budget set',k:[['Choice set','todas las alternativas disponibles'],['Budget set','combinaciones asequibles con precios y renta'],['Idea','se elige entre opciones FACTIBLES']],f:['pₓ·x + pᵧ·y ≤ m'],ej:'Pizza 2 €, zumo 1 €, m = 12 € → (3 pizzas, 6 zumos) = 12 € ✔ asequible.',tr:'No elegida ≠ no asequible. Para inferir preferencias hay que conocer restricciones.'},
{h:'Revealed preference y WARP',k:[['Revealed preference','inferir preferencias observando elecciones reales'],['WARP','si elijo A cuando B era asequible, no elijo después B si A sigue siendo asequible'],['Uso empresarial','analizar compras, cambios de proveedor, planes']],tr:'WARP no prohíbe cambiar de opinión: hay contradicción solo si ambas siguen factibles en condiciones comparables.'},
{h:'Utility, MU y MRS',k:[['Utility (u)','representación del ranking; ORDINAL (20 no es “el doble” que 10)'],['Marginal Utility','utilidad extra de 1 unidad más'],['Diminishing MU','cada unidad extra aporta menos'],['MRS','cuánto de y sacrifico por 1 de x manteniendo la utilidad']],f:['MUₓ = ∂u/∂x','MRSₓᵧ = MUₓ / MUᵧ'],ej:'u = xy → MUₓ = y, MUᵧ = x. En (2,4): MUₓ=4, MUᵧ=2, MRS = 2.',tr:'MU = beneficio marginal de UN bien · MRS = intercambio entre DOS bienes.'},
{h:'Utility maximization',k:[['Objetivo','combinación factible con mayor utilidad'],['Solución interior','igualar MU por euro'],['Corner solution','el óptimo puede estar en un extremo']],f:['max u(x,y)  s.a.  pₓx + pᵧy ≤ m','MUₓ / pₓ = MUᵧ / pᵧ'],ej:'u=xy, pₓ=2, pᵧ=1, (3,6): MUₓ/pₓ = 6/2 = 3 = MUᵧ/pᵧ = 3/1 ✔ equilibrado.',tr:'Compara MU/precio, no solo MU.'},
{h:'Efecto sustitución, renta y elasticidad',k:[['Substitution effect','hacia el bien relativamente más barato (utilidad constante)'],['Income effect','cambia el poder adquisitivo real'],['Total effect','suma de ambos'],['|ε|>1','elástica (reacciona mucho)'],['|ε|<1','inelástica'],['|ε|=1','unitaria']],f:['Slutsky: ∂x/∂p = efecto compensado − x·(∂x/∂m)','ε = %ΔQ / %ΔP'],ej:'Precio +10 %, ventas −20 % → ε = −2 → elástica.',tr:'Clasifica con |ε|. Income effect: signo depende de bien normal/inferior; substitution effect siempre hacia el más barato.'},
{h:'Expected Utility',k:[['Lottery','resultados + probabilidades'],['Outcomes','qué puede pasar'],['Beliefs','probabilidad de cada resultado'],['Utility','cuánto valoro cada resultado'],['u(x)=√x','cóncava → aversión al riesgo']],f:['EU(L) = Σ pᵢ·u(xᵢ)'],ej:'A: 20 € seguros → √20 ≈ 4,47. B: 50 % 50 € / 50 % 0 → 0,5·√50 ≈ 3,54. Elige A aunque EV(B) = 25 €.',tr:'Expected Value = dinero medio · Expected Utility = utilidad media. Pueden ordenar distinto.'},
{h:'Risk aversion, CE y Risk Premium',k:[['Risk aversion','prefiero lo seguro a una lotería con el mismo EV'],['Concave utility','MU de la riqueza decreciente'],['Certainty Equivalent','cantidad segura con la misma utilidad que la lotería'],['Risk Premium','lo que sacrifico del EV para evitar riesgo'],['Jensen','u cóncava ⇒ u(E[W]) ≥ E[u(W)]']],f:['u(CE) = E[u(W)]','RP = E[W] − CE','Averso: CE < E[W]'],ej:'50 % 50 € / 50 % 0, u=√x: EU = 3,536 → CE = 3,536² ≈ 12,5 €. EV = 25 € → RP = 12,5 €.',tr:'CE = dinero seguro equivalente · RP = EV − CE.'},
{h:'Arrow–Pratt',k:[['ARA','actitud ante riesgo de cantidad FIJA'],['RRA','actitud ante riesgo PROPORCIONAL a la riqueza'],['CARA','ARA constante'],['CRRA','RRA constante (γ=1 → ln w)'],['Uso','seguros, pago directivos, inversión, emprendimiento']],f:['A(w) = −u″(w) / u′(w)','R(w) = −w·u″(w)/u′(w) = w·A(w)','CARA: u = −e^(−αw), A = α','CRRA: u = w^(1−γ)/(1−γ), R = γ'],ej:'u=√w: A = 1/(2w). w = 100 → ARA = 0,005; RRA = 0,5.'},
{h:'Stochastic dominance',k:[['FSD','A ≥ B en todos los percentiles y > en alguno → todo el que prefiere más elige A'],['SSD','medias comparables, A con menos riesgo a la baja → todo averso al riesgo elige A'],['Regla','1º comprobar dominancia; si no ordena, usar la función de utilidad']],tr:'FSD = “más es mejor” para todos · SSD añade aversión al riesgo.'},
{h:'Allais vs. Ellsberg',k:[['Independence axiom','añadir la misma consecuencia con la misma prob. no cambia el orden'],['Allais paradox','A≻B pero D≻C → viola independence'],['Certainty effect','peso extra a lo seguro'],['Common consequence','resultado común añadido (89 % de 1 M€)'],['Risk','probabilidades conocidas'],['Ambiguity','probabilidades desconocidas'],['Ellsberg / ambiguity aversion','prefiero probabilidades conocidas']],ej:'Urna: 30 rojas + 60 negras/amarillas desconocidas → apostar a rojo (1/3 conocido) = ambiguity aversion.',tr:'Allais = certeza con probabilidades conocidas · Ellsberg = ambigüedad (desconocidas).'},
{h:'Bounded rationality y satisficing',k:[['Herbert Simon','atención, memoria, tiempo y cálculo limitados; info costosa; rutinas'],['Satisficing','elegir lo que cumple un mínimo aceptable']],f:['Seguir buscando si: ganancia esperada > coste de búsqueda (si ≤ → parar)'],ej:'25 % de ahorrar 8 € → ganancia esperada 2 €; buscar cuesta 3 € → parar.',tr:'Satisficing ≠ irracional: parar es razonable si buscar cuesta más.'},
{h:'Prospect Theory, probability weighting y framing',k:[['Reference point','define ganancia o pérdida'],['Loss aversion','pérdidas pesan más (~2×) que ganancias equivalentes'],['Diminishing sensitivity','lejos del punto de referencia, menos sensibilidad'],['Curva de valor','cóncava en ganancias, convexa en pérdidas, más empinada en pérdidas'],['Probability weighting','se sobreponderan probabilidades pequeñas'],['Framing','misma info, distinta presentación → distinta decisión']],ej:'“Ahorra 20 €” vs “evita una tasa de 20 €”.',tr:'Risk aversion = rechazo a la variabilidad · Loss aversion = pérdidas pesan más. Probability weighting ≠ creencia equivocada.'},
{h:'Intertemporal choice',k:[['Discounting','la utilidad futura vale menos'],['Exponential (δ)','factor constante → consistente en el tiempo'],['Present bias (β<1)','descuento extra a todo lo que no es “ahora” → procrastinación, reversión de preferencias']],f:['Exponencial: Uₜ = Σ δᵏ·uₜ₊ₖ','Present bias: Uₜ = uₜ + β·Σₖ≥₁ δᵏ·uₜ₊ₖ'],ej:'δ=0,9: 12 € mañana = 10,80 € hoy. Con β=0,7 → 7,56 € → elige 10 € hoy.'},
{h:'Preferencias sociales y motivation crowding',k:[['Fehr–Schmidt','me importa la desigualdad'],['αᵢ','aversión a quedar por detrás'],['βᵢ','aversión a quedar por delante'],['Ultimatum Game','teoría: aceptar cualquier oferta > 0; realidad: se rechazan ofertas injustas'],['Price effect','el incentivo sube el beneficio material'],['Signal effect','el incentivo comunica desconfianza / poco valor'],['Norm effect','una multa convierte una obligación moral en un precio']],f:['uᵢ = xᵢ − αᵢ·max(xⱼ−xᵢ,0) − βᵢ·max(xᵢ−xⱼ,0)'],tr:'Los incentivos no siempre aumentan la motivación total.'},
{h:'Game theory',k:[['Strategic interaction','mi resultado depende de lo que hagan otros'],['Best response','mejor acción dada la del otro'],['Nash equilibrium','nadie mejora cambiando SOLO'],['Coordination failure','acabar en un equilibrio peor'],['Herramientas','compromiso creíble, puntos focales, comunicación, base instalada']],ej:'Dos empresas eligen estándar tecnológico: 2 equilibrios de Nash, el mejor puede no alcanzarse.',tr:'Nash ≠ mejor resultado conjunto; puede ser ineficiente.'},
{h:'Bayesian updating',k:[['Prior','P(H) antes de la evidencia'],['Likelihood','P(E|H)'],['Evidence','P(E) total'],['Posterior','P(H|E) revisada'],['Base-rate neglect','ignorar el prior y fijarse solo en la señal']],f:['P(H|E) = P(E|H)·P(H) / P(E)'],ej:'Prior fallo 10 %; señal en 80 % de fallos y 20 % de no fallos → 0,08/(0,08+0,18) = 30,8 %.',tr:'P(E|H) ≠ P(H|E).'},
{h:'Diagnóstico integrado',k:[['Constraints','renta, precios, info, alternativas'],['Preferences','utilidad, justicia, tiempo, referencia'],['Beliefs','probabilidades, riesgo, ambigüedad'],['Decision process','optimización, heurísticas, atención'],['Interaction','juegos, instituciones, normas'],['Método','predicción de referencia → desviación → capa → intervención → bienestar']],tr:'No etiquetes todo lo inesperado como “irracional”.'}]},

{n:'T2',t:'Markets, organizations, knowledge & strategy',d:'Derechos de propiedad, mercados, empresas y ventaja competitiva',s:[
{h:'Property rights',k:[['Definición','derechos protegidos de usar, controlar, transferir o beneficiarse de un activo'],['Si son débiles','conflictos sobre quién usa, paga y cobra']],ej:'Fábrica contamina un río sin compensar → coste recae en terceros.',tr:'Tener físicamente ≠ poseer todos los derechos.'},
{h:'Tipos de bienes',k:[['Excludability','se puede impedir consumir a quien no paga'],['Rivalry','mi consumo reduce lo disponible']],tbl:[['Bien','Excluible','Rival','Ejemplo'],['Private','Sí','Sí','Comida'],['Club','Sí','No (hasta congestión)','Suscripción'],['Common-pool','Difícil','Sí','Pesquerías'],['Public','No','No','Alumbrado, defensa']],tr:'Public good ≠ producido por el Estado. Common-pool es RIVAL.'},
{h:'Externalities y market failure',k:[['Externality','coste/beneficio a terceros no reflejado en el precio'],['Negativa','contaminación'],['Positiva','vacunas, conocimiento'],['MSC / MPC / MEC','coste social / privado / externo'],['Resultado','si solo mira MPC → sobreproduce'],['Ostrom (1990)','common-pool gobernado por autogobierno comunitario']],f:['MSC = MPC + MEC'],tr:'Ostrom no niega la tragedia de los comunes: muestra soluciones intermedias.'},
{h:'Coase theorem',k:[['Enunciado','derechos bien definidos + costes de negociación nulos ⇒ resultado eficiente sea quien sea el dueño inicial'],['Asignación inicial','afecta a quién paga, no a la eficiencia'],['Límites','muchos afectados, info incompleta, costes de negociar, enforcement']],ej:'Fábrica vs lavandería: negocian reducir humo o compensar.',tr:'Coase NO dice que los derechos sean irrelevantes ni que negociar sea fácil.'},
{h:'Hayek: problema del conocimiento',k:[['Conocimiento disperso','costes locales, preferencias, circunstancias'],['Market coordination','los precios transmiten información'],['Central planning','difícil reunir y actualizar info dispersa']],ej:'Escasea un componente → sube el precio → todos ajustan.',tr:'Hayek no dice que los mercados sean perfectos.'},
{h:'Por qué existen las empresas (Coase)',k:[['Transaction costs','search, bargaining, enforcement, information asymmetry'],['Regla','internalizar si organizar dentro < usar el mercado']],ej:'Diseñador externo para cada logo vs uno interno.',tr:'La empresa existe por ahorrar costes de transacción, no solo por producir barato.'},
{h:'Asset specificity y hold-up',k:[['Asset specificity','inversión que vale mucho más en una relación concreta'],['Quasi-rent','valor que se pierde fuera de esa relación'],['Hold-up','el socio renegocia tras la inversión hundida'],['Consecuencia','under-investment anticipado']],ej:'Proveedor cotiza 40, tras invertir pide 55; hacerlo dentro cuesta 50 → make.',tr:'Hold-up ≠ simplemente precio alto: es oportunismo sobre una inversión específica.'},
{h:'TCE (Williamson): make, buy or ally',tbl:[['Gobernanza','Specificity','Incertidumbre','Ejemplo'],['Market (buy)','Baja','Baja','Material de oficina'],['Hybrid (ally)','Media','Media','JV, franquicia, contrato largo'],['Hierarchy (make)','Alta','Alta','Integrar']],k:[['Frequency','si se repite mucho, justifica estructura propia']],f:['Buy si C_M < C_H · Make si C_M > C_H'],tr:'No se integra todo lo importante: compara specificity, incertidumbre, frecuencia y costes.'},
{h:'Property-rights theory (GHM)',k:[['Incomplete contracts','no anticipan todo'],['Residual control rights','decidir en lo no previsto'],['Ownership','da esos derechos'],['Regla','propiedad a quien hace la inversión no contractual más importante']],tr:'Propiedad = control residual, no solo ingresos.'},
{h:'Spot vs. relational contracts',k:[['Spot','puntual, al precio vigente; flexible, poca protección'],['Relational','repetido, confianza y reputación']],tr:'Relational ≠ necesariamente informal o sin documento.'},
{h:'Economies of scope',k:[['Definición','producir juntos cuesta menos que por separado'],['Se comparte','marca, distribución, tecnología, datos']],f:['C(A,B) < C(A) + C(B)'],ej:'Personajes en películas, parques y merchandising.',tr:'Scale = más unidades del MISMO producto · Scope = productos DISTINTOS juntos.'},
{h:'Value stick',k:[['WTP','máximo que paga el cliente'],['WTS','mínimo que acepta el proveedor'],['Reparto','excedente cliente + margen empresa + excedente proveedor'],['Palancas','↑ WTP (diferenciación) · ↓ WTS (proveedores) · ↓ costes internos']],f:['Value created = WTP − WTS','Margen = Price − Cost'],tr:'Un descuento negociado no demuestra que haya bajado el WTS del proveedor.'},
{h:'RBV y VRIN',k:[['Valuable','aprovecha oportunidades / neutraliza amenazas'],['Rare','pocos rivales lo tienen'],['Inimitable','difícil de copiar (historia, complejidad social, ambigüedad causal)'],['Non-substitutable','sin equivalente estratégico']],tr:'Valioso no basta: si se puede comprar o copiar, no es VRIN.'},
{h:'Porter’s Five Forces',k:[['Rivalry','competencia entre actuales'],['New entrants','facilidad de entrar'],['Substitutes','otra forma de cubrir la necesidad'],['Supplier power','proveedores imponen condiciones'],['Buyer power','clientes exigen precio/condiciones']],ej:'Streaming vs cine = substitutes · pocos proveedores de un componente = supplier power.',tr:'Un sustituto no vende el mismo producto.'},
{h:'Corporate strategy',k:[['Horizontal diversification','negocios relacionados'],['Vertical integration','upstream / downstream'],['Global strategy','escala vs adaptación local'],['Test','¿vale más dentro que independiente, tras costes de coordinación?']],tr:'Crecer/comprar no crea valor automáticamente.'}]},

{n:'T3',t:'Incentive conflicts & contracts',d:'Agencia, incentivos, contratos y relaciones entre empresas',s:[
{h:'Nexus of contracts',k:[['Jensen & Meckling','empresa = red de contratos'],['Coase','autoridad interna sustituye al mercado'],['Simon: zone of acceptance','el trabajador acepta tareas dentro de un ámbito sin renegociar']]},
{h:'Principal–agent problem',k:[['Principal','delega (accionistas, empresa, cliente)'],['Agent','ejecuta (CEO, comercial, proveedor)'],['Problema','objetivos distintos + info que el principal no observa']]},
{h:'Agency costs',k:[['Monitoring','lo paga el PRINCIPAL: auditorías, KPI, consejo'],['Bonding','lo paga el AGENTE: garantías, no competencia, salario diferido'],['Residual loss','pérdida que queda tras los controles']],f:['Agency costs = Monitoring + Bonding + Residual loss'],tr:'Objetivo: minimizar el coste total, no eliminar el problema.'},
{h:'Adverse selection vs. moral hazard',k:[['Adverse selection','TIPO oculto ANTES del contrato'],['Moral hazard','ACCIÓN/esfuerzo oculto DESPUÉS'],['Screening','el no informado diseña pruebas (entrevista, periodo de prueba)'],['Signalling','el informado envía señal creíble (título, garantía)'],['Contra moral hazard','incentivos, supervisión, pago diferido'],['Akerlof (1970)','lemons: la buena calidad sale del mercado']],tr:'Pregunta clave: ¿cuándo está oculta la info? Antes = AS · Después = MH.'},
{h:'Linear contract y risk–incentive trade-off',k:[['b','intensidad del incentivo'],['r','aversión al riesgo del agente'],['c','coste del esfuerzo'],['σ²','ruido de la medida'],['b* baja si','↑r, ↑c o ↑σ²']],f:['Pay = salary + b × measured output','b* = 1 / (1 + r·c·σ²)'],ej:'Comerciales → comisiones · I+D → salario fijo / incentivo moderado.',tr:'Más incentivo no siempre es mejor: transfiere riesgo al agente.'},
{h:'Informativeness principle',k:[['Holmström','usar señales informativas del esfuerzo; no premiar lo que el agente no controla'],['Relative Performance Evaluation','comparar con empresas similares → filtra shocks comunes'],['Pay for luck','pagar por suerte']],ej:'Sube el petróleo y todo el sector gana → no es mérito del CEO.'},

const ta=$('#ans');ta.value=q.draft||'';ta.oninput=()=>{q.draft=ta.value};ta.focus();
const lock=()=>{$('#chk').disabled=true;$('#skip').disabled=true;ta.readOnly=true};
$('#skip').onclick=()=>{lock();finish(q,false);$('#fb').innerHTML=`<div class="fb bad"><b>Model answer:</b> ${q.m}<div class="mut">You’ll repeat it at the end of the round.</div></div><div class="row">${next}</div>`;$('#nx').onclick=()=>{qz.i++;showQ()}};
$('#chk').onclick=async()=>{const a=ta.value.trim();if(a.length<3){ta.focus();return}lock();
const fb=$('#fb');let res=null;
if(SAMPLE){fb.innerHTML='<div class="fb"><span class="mut">⏳ Claude is marking your answer…</span></div>';
try{res=await SAMPLE.json(gradePrompt(q,a),{modelTier:'default',effort:'low'});if(!res||typeof res.score!=='number')res=null}catch(e){res=null;if(e&&(e.code==='not_granted'||e.code==='sampling_disabled'))SAMPLE=null}}
const r=res?fromClaude(res):localGrade(q,a);finish(q,r.ok);
fb.innerHTML=`<div class="fb ${r.cls}"><b class="${r.ok?'ok':'ko'}">${r.title}</b>${r.body}<p style="margin:8px 0 0"><b>Model answer:</b> ${q.m}</p>${r.ok?'':'<div class="mut">You’ll repeat it at the end of the round.</div>'}${res?'':'<div class="mut" style="margin-top:6px">Automatic marking by key concepts (Claude marking is not available here).</div>'}</div><div class="row">${next}</div>`;
$('#nx').onclick=()=>{qz.i++;showQ()}}}

function gradePrompt(q,a){return `You are a lecturer for the university course "Business Organization". Mark a student's short answer.
Criteria: do NOT require perfect writing, a complete answer, or exact terminology. Assess whether the concepts the student uses are correct, whether they capture the main idea, and whether they say anything wrong. A short answer with the correct core idea should pass (score ≥ 6). The student may answer in English or Spanish. Write your feedback in English, briefly and kindly.

Question: ${q.q}
Expected key concepts (guidance): ${q.k.map(x=>x.split('|')[0]).join('; ')}
Model answer: ${q.m}

Student answer:
"""${a.slice(0,3000)}"""

Reply ONLY with JSON in this shape:
{"score": number from 0 to 10, "verdict": "correct" | "partly correct" | "incorrect", "good": ["concepts used correctly"], "errors": ["concepts used wrongly and why, one sentence each"], "missing": ["important key ideas that are missing"], "comment": "1-2 sentences of feedback"}`}
const li=(t,a,c)=>a&&a.length?`<p style="margin:8px 0 2px"><b class="${c}">${t}</b></p><ul class="k">${a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
function fromClaude(r){const n=Math.max(0,Math.min(10,Math.round(r.score))),ok=n>=6;
return{ok,cls:n>=7?'good':ok?'mid':'bad',title:`${ok?'✓':'✗'} ${n}/10 · ${esc(r.verdict||(ok?'correct':'incorrect'))}`,
body:(r.comment?`<p style="margin:6px 0 0">${esc(r.comment)}</p>`:'')+li('✓ Concepts used correctly',r.good,'ok')+li('✗ Mistakes',r.errors,'ko')+li('➕ What was missing',r.missing,'')}}
function localGrade(q,a){const s=' '+norm(a)+' ';const hit=[],miss=[];
q.k.forEach(k=>{const alts=k.split('|').map(norm).filter(Boolean);(alts.some(x=>s.includes(x))?hit:miss).push(k.split('|')[0])});
const p=hit.length/q.k.length,ok=p>=.5;
return{ok,cls:p>=.75?'good':ok?'mid':'bad',title:`${ok?'✓':'✗'} ${hit.length}/${q.k.length} key concepts`,body:li('✓ Concepts you mention',hit,'ok')+li('➕ Missing concepts',miss,'')}}
function endPass(){const v=$('#view'),bien=qz.ok,mal=qz.wrong;const strip=s=>s.replace(/<[^>]+>/g,'');const L=a=>a.map(q=>`<li>${strip(q.q)}</li>`).join('');
if(!mal.length){const f=qz.first;v.innerHTML=`<div class="card"><h2>🎉 Round complete!</h2><p>${qz.total} questions · ${qz.total-f.length} right first time${qz.round>1?` · finished in ${qz.round} rounds`:''}.</p>${f.length?`<p class="mut">Review the ones you found hard:</p><ul>${f.map(q=>`<li>${strip(q.q)}<br><span class="mut">→ ${q.type==='mc'?q.o[q.a]:q.type==='num'?q.sol:q.m}</span></li>`).join('')}</ul>`:''}<div class="row"><button class="pri" id="again">Another round</button><button id="menu">Change topic</button></div></div>`;
$('#again').onclick=()=>{qz=null;quiz();$('#start').click()};$('#menu').onclick=()=>{qz=null;quiz()};return}
v.innerHTML=`<div class="card"><h2>Round ${qz.round}: ${bien.length} right · ${mal.length} to repeat</h2>${bien.length?`<p class="ok"><b>✓ Right</b></p><ul>${L(bien)}</ul>`:''}<p class="ko"><b>✗ To repeat</b></p><ul>${L(mal)}</ul><div class="row"><button class="pri" id="rep">Repeat the wrong ones</button><button id="menu">Exit</button></div></div>`;
$('#rep').onclick=()=>{mal.forEach(q=>{delete q.ord;q.draft=''});qz.qs=shuf(mal.map(q=>q.type==='num'&&q.gen?Object.assign({type:'num',gen:q.gen},q.gen()):q));qz.i=0;qz.wrong=[];qz.ok=[];qz.round++;showQ()};$('#menu').onclick=()=>{qz=null;quiz()}}
/* load uploaded syllabus: db inside claude.ai, localStorage elsewhere */
if(!window.claude){UPS=(window.AULA||[]).concat(LS.get('bo-uploads',[]));DBST='local';applyUploads()}
render();
if(window.claude)(async()=>{try{DB=await claude.use('db')}catch(e){DB=null}
if(!DB){UPS=LS.get('bo-uploads',[]);DBST='local';applyUploads();rerender();return}
const tm=setTimeout(()=>{if(DBST==='loading'){DBST='slow';rerender()}},10000);
DB.collection('uploads').onSnapshot(s=>{if(!s.metadata.fromCache)clearTimeout(tm);DBST='ok';UPS=s.docs.map(d=>({id:d.id,...d.data()}));applyUploads();rerender()},
e=>{clearTimeout(tm);DBST='err';rerender()})})();
</script>
</body></html>
