<title>ESCI</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="campus.css">
<style>
/* Mismo diseño que la portada de la web (campus.css): una columna centrada con el saludo y el buscador; al preguntar, solo la conversación.
   Aspecto claro único, como el resto de la web: todos los colores salen de los tokens de campus.css. */
:root{--bg:#f6f8fb;--card:#fff;--ink:#0b2540;--fg:#1f2d3d;--mut:#64748b;--bd:#e3e8ef;--gold:#f7a833;--navy:#0b2540;--ia:#6d4aff;--ia-b:#f1edff;color-scheme:light}
html,body{height:100%}
body.portada{background:radial-gradient(ellipse 70% 55% at 50% 62%,#cfe4fb 0%,#e6f0fc 45%,#f6f8fb 100%) fixed;color:var(--fg);min-height:0}
body.portada main{padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
.top .in{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.iab{display:inline-block;font:700 12.5px "Open Sans",system-ui,sans-serif;color:var(--ia);background:var(--ia-b);border:1px solid #d9d0ff;border-radius:99px;padding:5px 12px}
.iab.off{color:var(--mut);background:#eef2f7;border-color:var(--bd)}
.chat .chd{align-items:center;gap:8px}
.chat .chd .iab{margin-right:auto}
.chat .chd .clr{margin-left:0}
.cover .iab{margin-top:14px}
.msg pre{background:#0b2540;color:#e6edf5;border-radius:10px;padding:10px 12px;overflow-x:auto;font-size:13.5px}
.msg code{background:#eef2f7;border-radius:5px;padding:1px 5px;font-size:.92em}
.msg hr{border:0;border-top:1px solid var(--bd);margin:10px 0}
.msg.ia{max-width:100%}
.nota{max-width:860px;margin:0 auto 30px;text-align:center;color:var(--mut);font-size:13px}
body.chatting .nota{display:none}
/* adjuntos */
.chat .clip{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:#fff;color:var(--ink);font:400 24px/1 "Open Sans",sans-serif;cursor:pointer}
.chat .clip:hover{border-color:var(--gold);background:#fff7e6}
.chat form{padding-left:8px}
.tray{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 6px 8px}
.att{display:inline-flex;align-items:center;gap:6px;max-width:100%;background:#fff;border:1px solid var(--bd);border-radius:99px;padding:5px 6px 5px 12px;font-size:13.5px;color:var(--ink);overflow-wrap:anywhere}
.att button{border:0;background:#eef2f7;color:var(--mut);border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;flex:none}
.msg .atts{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.msg .atts span{background:rgba(255,255,255,.16);border-radius:99px;padding:2px 10px;font-size:12.5px}
/* asignaturas, calendario y notas se abren aquí dentro, debajo de la barra */
#vista{border:0;width:100%;height:calc(100dvh - 56px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--bg);display:block}
#vista[hidden]{display:none}
body.viendo main{display:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>

<header class="top"><div class="in">
  <a class="brand" href="#chat" data-v="chat"><i>🎓</i><span>Estudio</span></a>
  <nav class="nav" id="menu">
    <a class="on" href="#chat" data-v="chat">Chat</a>
    <a href="#asignaturas" data-v="asignaturas">Asignaturas</a>
    <a href="#calendario" data-v="calendario">Calendario</a>
    <a href="#notas" data-v="notas">Notas</a>
  </nav>
</div></header>
<iframe id="vista" title="Página de estudio" hidden></iframe>

<main>
<section class="hero cover conchat">
  <span class="badge" id="curso">📍 ESCI-UPF</span>
  <h1><b>Hola,</b> Martí</h1>
  <span class="iab off">Conectando con Claude…</span>
</section>
<section class="chat" id="chat" aria-label="Chat de estudio con IA">
  <div class="chd"><span class="iab off">Conectando con Claude…</span><button class="clr" type="button" id="nueva" title="Borrar la conversación y volver al inicio">✕ Nueva conversación</button></div>
  <div class="log" aria-live="polite"></div>
  <div class="tray" hidden aria-live="polite"></div>
  <input type="file" id="archivos" multiple hidden accept="image/jpeg,image/png,image/webp,image/gif,.pdf,.docx,.pptx,.txt,.md,.csv">
  <form autocomplete="off"><button class="clip" type="button" id="adjuntar" aria-label="Adjuntar archivos" title="Adjuntar imágenes, PDF, Word, PowerPoint o texto">+</button><input type="text" id="pregunta" placeholder="Pregúntame algo…" aria-label="Tu mensaje" enterkeyhint="send"><button class="send" type="submit" aria-label="Enviar">↑</button></form>
  <div class="sugg">
    <button data-say="¿Qué tengo para hoy?">¿Qué tengo para hoy?</button>
    <button data-say="Explícame la diferencia entre adverse selection y moral hazard con un ejemplo">Explícame adverse selection vs moral hazard</button>
    <button data-say="Ponme 4 ejercicios tipo test de Business sobre incentive conflicts">4 tests de Business</button>
    <button data-say="Prepárame un caso de Communication para analizar el register">Un caso de Communication</button>
    <button data-say="Ponme ejercicios de francés para el parcial: posesivos y negación">Francés para el parcial</button>
    <button data-say="¿Qué entra en el parcial de francés y cómo me organizo hasta el martes?">Organízame el parcial</button>
  </div>
  <p class="nota">Las respuestas las escribe Claude con tu temario y gastan del uso de tu plan. El calendario se contesta al instante, sin gastar.</p>
</section>
</main>

<script src="datos.js"></script>
<script src="cal.js"></script>
<script>
(function(){const d=new Date(),m=d.getMonth()+1,ini=m>=9?d.getFullYear():d.getFullYear()-1;
  const ORD=['Primer','Segundo','Tercer','Cuarto'],c=Math.min(Math.max(ini-2026,0),3),t=m>=9?0:m<=3?1:2;
  document.getElementById('curso').textContent=`📍 ESCI-UPF · ${ORD[c]} curso · ${ORD[t]} trimestre`;
  document.body.classList.add('portada')})();

/* Navegación: todo vive en esta página. El chat es la vista principal; asignaturas, calendario y notas se cargan en el marco #vista.
   Las páginas de dentro traen su propia barra y enlaces a index.html: se oculta la barra y esos enlaces vuelven al chat. */
(function(){
  const PAG={asignaturas:'asignaturas.html',calendario:'agenda.html',notas:'notas.html'},
        DE={'asignaturas.html':'asignaturas','business.html':'asignaturas','communication.html':'asignaturas','francais.html':'asignaturas','mates.html':'asignaturas','agenda.html':'calendario','notas.html':'notas'};
  const f=document.getElementById('vista'),menu=document.getElementById('menu');
  const marca=v=>menu.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  function ir(v,hash){
    if(!PAG[v])v='chat';
    document.body.classList.toggle('viendo',v!=='chat');f.hidden=v==='chat';marca(v);
    if(v!=='chat'){f.src=PAG[v]}
    if(hash!==false){try{if(location.hash.slice(1)!==v)location.hash=v}catch(e){}}
    scrollTo(0,0);
  }
  window.irA=ir;
  const destino=h=>{h=String(h||'').split(/[?#]/)[0];return /(^|\/)index\.html$/.test(h)?'chat':/(^|\/)actualizar\.html$/.test(h)?'fuera':DE[h.replace(/^.*\//,'')]&&PAG[DE[h.replace(/^.*\//,'')]]===h.replace(/^.*\//,'')?DE[h.replace(/^.*\//,'')]:null};
  f.addEventListener('load',()=>{let d;try{d=f.contentDocument}catch(e){return}if(!d||!d.body)return;
    const st=d.createElement('style');st.textContent='header.top{display:none!important}body{padding-top:6px}';(d.head||d.body).appendChild(st);
    const v=DE[(d.location.pathname||'').replace(/^.*\//,'')];if(v)marca(v);
    d.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;const k=destino(a.getAttribute('href'));
      if(k==='chat'){e.preventDefault();ir('chat')}else if(k==='fuera'){e.preventDefault()}},true);
  });
  document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href]');if(!a)return;
    if(a.dataset.v){e.preventDefault();ir(a.dataset.v);return}
    const k=destino(a.getAttribute('href'));if(k&&k!=='fuera'){e.preventDefault();ir(k)}});
  addEventListener('hashchange',()=>ir(location.hash.slice(1),false));
  if(PAG[location.hash.slice(1)])ir(location.hash.slice(1),false);
})();
</script>
<script src="chat.js"></script>
