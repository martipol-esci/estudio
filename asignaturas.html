<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Asignaturas · Estudio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="campus.css">
</head><body>
<header class="top"><div class="in">
  <a class="brand" href="index.html"><i>🎓</i><span>Estudio</span></a>
  <nav class="nav">
    <a class="on" href="asignaturas.html">Asignaturas</a>
    <a href="agenda.html">Calendario</a>
    <a href="notas.html">Notas</a>
    <a href="actualizar.html">Temario nuevo</a>
  </nav>
</div></header>

<main class="cols">
<div class="colmain">
  <h2 class="sec">Asignaturas</h2>
  <p class="mut">Elige una asignatura para ver su temario y practicar.</p>
  <div class="grid" id="subs"></div>

</div>

<aside class="pend">
  <h2 class="sec">Tareas pendientes</h2>
  <p class="mut">Esta semana, por orden de entrega.</p>
  <ol class="todo" id="todo"></ol>
  <a class="go" href="agenda.html">Ver el calendario →</a>
</aside>
</main>

<script src="temas.js"></script>
<script src="datos.js"></script>
<script src="cal.js"></script>
<script>
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.getElementById('subs').innerHTML=ASIG.map(a=>{
  const P=get(a.prog,{});let n=0,ok=0;Object.values(P).forEach(x=>{n+=x.n||0;ok+=x.ok||0});
  const pg=n?`${n} preguntas respondidas · ${Math.round(100*ok/n)}% de aciertos`:'Aún sin practicar en este dispositivo';
  return `<a class="subj" href="${a.pagina}" style="--c:${a.color}">
    <span class="ico">${a.emoji}</span><span class="nm">${a.nombre}</span>
    <span class="tags">${a.secciones.map(s=>`<span class="tag">${s}</span>`).join('')}</span>
    <span class="pg">${pg}</span><span class="go">Abrir →</span></a>`}).join('');
try{
  const h=CAL.hoy(),dom=new Date(h);dom.setDate(h.getDate()+(7-(h.getDay()||7)));const fin=CAL.ymd(dom);
  const P=CAL.porFecha().filter(e=>e.desde<=fin),A=DATOS.asig;
  document.getElementById('todo').innerHTML=P.length?P.map(e=>{const a=A[e.asig];
    return `<li class="n${e.n}"><span class="tt">${esc(e.t)}</span>${a?`<span class="mut">${a.emoji} ${esc(a.nombre)}</span>`:''}</li>`}).join('')
    :'<li class="n0"><span class="tt">Nada más esta semana 🎉</span></li>';
}catch(e){}
</script>
</body></html>
